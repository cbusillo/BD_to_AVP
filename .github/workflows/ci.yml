---
name: CI

"on":
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  validate:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - name: Check out repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: support-diagnostics/package-lock.json

      - name: Set up uv
        # Trusted toolchain publisher for uv; see CodeQL alert triage from 2026-07-07.
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked --all-groups --python 3.12

      - name: Rebuild bundled edge264 with release toolchain
        env:
          DEVELOPER_DIR: /Applications/Xcode_26.5.app/Contents/Developer
        run: |
          uv run python scripts/build_edge264_macos.py --output "$RUNNER_TEMP/edge264_test"
          cmp bd_to_avp/bin/edge264_test "$RUNNER_TEMP/edge264_test"

      - name: Install support diagnostics dependencies
        working-directory: support-diagnostics
        run: npm ci

      - name: Validate support diagnostics service
        working-directory: support-diagnostics
        run: npm run check

      - name: Validate support diagnostics deployment config
        working-directory: support-diagnostics
        run: npm run deploy:dry-run

      - name: Verify committed SSIF probe artifacts
        run: uv run python scripts/build_ssif_probe_macos.py --verify-only

      - name: Validate committed release metadata
        run: uv run python -m scripts.release validate

      - name: Validate observability migration
        run: uv run python scripts/validate_observability_migration.py

      - name: Validate video quality ladder contract
        run: uv run python scripts/validate_video_quality_ladder.py

      - name: Check formatting
        run: uv run ruff format --check .

      - name: Lint
        run: uv run ruff check .

      - name: Type check
        run: uv run mypy bd_to_avp

      - name: Unit smoke tests
        run: uv run python -m unittest discover -s tests -t .

      - name: Verify committed release evidence
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BASE_SHA: ${{ github.event.before }}
        run: |
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            BASE_SHA="$PR_BASE_SHA"
          elif [[ "$EVENT_NAME" == "push" && "$PUSH_BASE_SHA" != "0000000000000000000000000000000000000000" ]]; then
            BASE_SHA="$PUSH_BASE_SHA"
          else
            BASE_SHA=$(git rev-parse HEAD^)
          fi
          uv run python -m scripts.release_evidence_v2 \
            --all-tags \
            --worktree \
            --base-revision "$BASE_SHA"

      - name: Verify release evidence index
        run: uv run python -m scripts.release_evidence_v2 index --check --worktree

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Build and conditionally test BDToAVPPlayer visionOS bundle
        env:
          DEVELOPER_DIR: /Applications/Xcode_26.5.app/Contents/Developer
        run: |
          set -euo pipefail
          cd macos
          export DEVELOPER_DIR="/Applications/Xcode_26.5.app/Contents/Developer"
          test -x "$DEVELOPER_DIR/usr/bin/xcodebuild"
          test "$(xcodebuild -version | sed -n '1p')" = "Xcode 26.5"
          xcodegen generate --spec project.yml
          xcodebuild build-for-testing \
            -project BluRayToVisionPro.xcodeproj \
            -scheme BDToAVPPlayer \
            -configuration Debug \
            -destination "generic/platform=visionOS Simulator" \
            -derivedDataPath build/BDToAVPPlayerDerivedData \
            CODE_SIGNING_ALLOWED=NO

          runtime_id="$(xcrun simctl list runtimes -j | jq -r '
            [.runtimes[]
              | select(.isAvailable == true)
              | select(.platform == "visionOS" or (.name | startswith("visionOS")))
              | select((.version | split(".")[0] | tonumber) >= 26)
              | .identifier]
            | first // empty
          ')"
          device_type_id="$(xcrun simctl list devicetypes -j | jq -r '
            [.devicetypes[] | select(.name == "Apple Vision Pro") | .identifier]
            | first // empty
          ')"

          if [[ -z "$runtime_id" || -z "$device_type_id" ]]; then
            echo "::notice::Skipping BDToAVPPlayer visionOS unit tests: an available visionOS 26+ runtime and Apple Vision Pro device type are required (runtime=${runtime_id:-none}, device_type=${device_type_id:-none})."
            exit 0
          fi

          simulator_name="BDToAVPPlayer CI ${GITHUB_RUN_ID:-local}-${GITHUB_RUN_ATTEMPT:-1}"
          simulator_udid="$(xcrun simctl create "$simulator_name" "$device_type_id" "$runtime_id")"
          cleanup_simulator() {
            xcrun simctl shutdown "$simulator_udid" >/dev/null 2>&1 || true
            xcrun simctl delete "$simulator_udid" >/dev/null 2>&1 || true
          }
          trap cleanup_simulator EXIT INT TERM

          xcrun simctl boot "$simulator_udid"
          xcrun simctl bootstatus "$simulator_udid" -b
          xcodebuild test-without-building \
            -project BluRayToVisionPro.xcodeproj \
            -scheme BDToAVPPlayer \
            -configuration Debug \
            -destination "platform=visionOS Simulator,id=$simulator_udid" \
            -derivedDataPath build/BDToAVPPlayerDerivedData \
            CODE_SIGNING_ALLOWED=NO

      - name: macOS app tests
        run: uv run python scripts/native_app.py test

      - name: Package native macOS app smoke
        env:
          BD_TO_AVP_SUPPORT_DIAGNOSTICS_ENDPOINT: https://diagnostics.shinycomputers.com
          DEVELOPER_DIR: /Applications/Xcode_26.5.app/Contents/Developer
        run: uv run python scripts/native_app.py package

      - name: Import smoke
        run: >-
          uv run python -c
          "import bd_to_avp; import bd_to_avp.__main__; import bd_to_avp.app"

      - name: CLI-only install smoke
        env:
          UV_PROJECT_ENVIRONMENT: .venv-cli
        run: |
          uv sync --locked --no-default-groups --no-editable --python 3.12
          .venv-cli/bin/python -c \
            "import importlib.util; assert importlib.util.find_spec('PySide6') is None"
          .venv-cli/bin/bd-to-avp --version
          .venv-cli/bin/bd-to-avp --help >/dev/null
          if OUTPUT=$(.venv-cli/bin/bd-to-avp 2>&1); then
            echo "CLI-only install unexpectedly started the GUI." >&2
            exit 1
          fi
          grep -F 'bd_to_avp[gui]' <<< "$OUTPUT"

      - name: Build Python package
        run: uv build

      - name: Verify bundled tools and deployment targets
        run: uv run python scripts/verify_app_tools.py

      - name: Resolve post-publication milestone context
        id: milestone-context
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          uv run python -m scripts.release_milestone_context \
            --base-sha "${{ github.event.pull_request.base.sha }}" \
            --head-sha "${{ github.event.pull_request.head.sha }}" \
            --head-branch "$GITHUB_HEAD_REF" \
            --base-repo "${{ github.event.pull_request.base.repo.full_name }}" \
            --head-repo "${{ github.event.pull_request.head.repo.full_name }}" \
            --base-branch "${{ github.event.pull_request.base.ref }}" \
            --github-output "$GITHUB_OUTPUT"

      - name: Classify post-publication milestone evidence
        id: milestone-qualification
        if: steps.milestone-context.outputs.required == 'true'
        continue-on-error: true
        env:
          CANDIDATE_SHA: ${{ steps.milestone-context.outputs.candidate_sha }}
          EVIDENCE_PATH: ${{ steps.milestone-context.outputs.evidence_path }}
          FIRST_CANDIDATE_OF_CYCLE: ${{ steps.milestone-context.outputs.first_candidate_of_cycle }}
          POLICY_PATH: ${{ steps.milestone-context.outputs.policy_path }}
          QUALIFICATION_PATH: ${{ steps.milestone-context.outputs.qualification_path }}
          RELEASE_RECEIPT_PATH: ${{ steps.milestone-context.outputs.release_receipt_path }}
          RELEASE_STAGE: ${{ steps.milestone-context.outputs.release_stage }}
        run: |
          set -euo pipefail
          ARGS=(
            --policy "$POLICY_PATH"
            --candidate-sha "$CANDIDATE_SHA"
            --qualification "$QUALIFICATION_PATH"
            --evidence "$EVIDENCE_PATH"
            --milestone-release-receipt "$RELEASE_RECEIPT_PATH"
            --release-stage "$RELEASE_STAGE"
            --workflow-phase milestone
            --output release-qualification-milestone.json
            --require-evidence
          )
          if [ "$FIRST_CANDIDATE_OF_CYCLE" = "true" ]; then
            ARGS+=(--first-candidate-of-cycle)
          fi
          uv run python -m scripts.qualify_release_scope "${ARGS[@]}"

      - name: Upload post-publication milestone report
        if: always() && steps.milestone-context.outputs.required == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-qualification-milestone-${{ github.run_attempt }}
          path: release-qualification-milestone.json
          if-no-files-found: error
          retention-days: 30

      - name: Summarize post-publication operational evidence
        if: always() && steps.milestone-context.outputs.required == 'true'
        run: |
          set -euo pipefail
          test -f release-qualification-milestone.json
          {
            echo "## Post-publication qualification"
            echo
            jq -r '
              .cases[]
              | select(.operational_status != null)
              | "- `\(.case_id)`: **\(.operational_status)** (release blocking: `\(.blocking)`)"
            ' release-qualification-milestone.json
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Enforce post-publication milestone evidence
        if: always() && steps.milestone-context.outputs.required == 'true'
        env:
          MILESTONE_OUTCOME: ${{ steps.milestone-qualification.outcome }}
        run: |
          set -euo pipefail
          if [ "$MILESTONE_OUTCOME" != "success" ]; then
            echo "Blocking post-publication qualification is incomplete or invalid." >&2
            exit 1
          fi
