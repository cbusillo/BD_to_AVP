---
name: CI

"on":
  push:
    branches:
      - main
      - "launchplane/train/**"
  pull_request:
  workflow_dispatch:
    inputs:
      vision_ocr_diagnostics:
        description: Run the bounded native Vision OCR qualification matrix
        type: boolean
        default: false

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  lanes:
    name: Select lanes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      native: ${{ steps.lanes.outputs.native }}
      player: ${{ steps.lanes.outputs.player }}
      started: ${{ steps.started.outputs.epoch }}
    steps:
      - name: Record when CI started
        id: started
        run: echo "epoch=$(date +%s)" >> "$GITHUB_OUTPUT"

      - name: Check out repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Set up uv
        # Trusted toolchain publisher for uv; see CodeQL alert triage from 2026-07-07.
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true

      - name: Select the lanes this change needs
        id: lanes
        env:
          EVENT_NAME: ${{ github.event_name }}
          GIT_REF: ${{ github.ref }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        # The full-history checkout above includes origin/main, which a merge-train
        # candidate is diffed against.
        run: >-
          uv run --no-project --with pyyaml python scripts/ci_lanes.py
          --event "$EVENT_NAME" --ref "$GIT_REF" --base "$PR_BASE_SHA"

  checks:
    name: Python, evidence and packaging checks
    runs-on: xcode-27
    timeout-minutes: 30
    permissions:
      contents: read
      # The release evidence check finds the pull request a merge-train candidate carries.
      pull-requests: read
    steps:
      - name: Check out repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: support-diagnostics/package-lock.json

      - name: Set up uv
        # Trusted toolchain publisher for uv; see CodeQL alert triage from 2026-07-07.
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked --all-groups --python 3.12

      - name: Install support diagnostics dependencies
        working-directory: support-diagnostics
        run: npm ci

      - name: Validate support diagnostics service
        working-directory: support-diagnostics
        run: npm run check

      - name: Validate support diagnostics deployment config
        working-directory: support-diagnostics
        run: npm run deploy:dry-run

      - name: Verify committed Blu-ray reader artifacts
        run: uv run python scripts/build_bluray_reader_macos.py --verify-only

      - name: Validate committed release metadata
        run: uv run python -m scripts.release validate

      - name: Validate video quality ladder contract
        run: uv run python scripts/validate_video_quality_ladder.py

      - name: Check formatting
        run: uv run ruff format --check .

      - name: Lint
        run: |
          set -euo pipefail
          lint_command="$(jq -er '.qualityGate.lint.default | select(type == "string" and length > 0)' .github/github.json)"
          bash -euo pipefail -c "$lint_command"

      - name: Type check
        run: uv run mypy bd_to_avp

      - name: Install fixture decoders
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
          HOMEBREW_NO_INSTALLED_DEPENDENTS_CHECK: "1"
          HOMEBREW_NO_INSTALL_CLEANUP: "1"
        run: |
          brew install ffmpeg
          ffmpeg -version
          ffprobe -version

      - name: Unit smoke tests
        # One worker per core; each test class stays on one worker.
        env:
          BD_TO_AVP_REQUIRE_REAL_PGS_TESTS: "1"
          # #893: Vision text recognition fails natively in the hosted macOS
          # VM (Swift fails on the same bitmaps), while a physical Mac on the
          # same 27.0.1 build passes. The full OCR test stays enabled elsewhere.
          BD_TO_AVP_HOSTED_VISION_OCR_SKIP_REASON: >-
            Hosted macOS VM Vision OCR returns false without NSError; physical
            Macs on the same build pass (#893). Real PGS extraction/mux still
            runs with bitmap-checked recognition. Run locally for actual OCR.
        run: |
          set -euo pipefail
          test_command="$(jq -er '.qualityGate.test.ci | select(type == "string" and length > 0)' .github/github.json)"
          bash -euo pipefail -c "$test_command"

      - name: Diagnose hosted native Vision OCR
        if: ${{ !cancelled() && github.event_name == 'workflow_dispatch' && inputs.vision_ocr_diagnostics }}
        # #893: experiments preserve their own nonzero status and logs; they
        # neither select a production backend nor replace the unit-test gate.
        timeout-minutes: 10
        run: |
          mkdir -p build/vision-ocr
          for mode in default cpu-only fast; do
            echo "$mode started" | tee -a build/vision-ocr/status.txt
            status=0
            dump=()
            if [ "$mode" = default ]; then dump=(--dump-bitmaps build/vision-ocr/bitmaps); fi
            uv run python -m scripts.qualify_vision_ocr --mode "$mode" "${dump[@]}" > "build/vision-ocr/$mode.log" 2>&1 || status=$?
            echo "$mode exit=$status" | tee -a build/vision-ocr/status.txt
            cat "build/vision-ocr/$mode.log"
          done
          # Same bitmaps through Vision without PyObjC.
          echo "swift started" | tee -a build/vision-ocr/status.txt
          status=0
          { xcrun swiftc scripts/vision_ocr_control.swift -o build/vision-ocr-control \
            && build/vision-ocr-control build/vision-ocr/bitmaps; } > build/vision-ocr/swift.log 2>&1 || status=$?
          echo "swift exit=$status" | tee -a build/vision-ocr/status.txt
          cat build/vision-ocr/swift.log

      - name: Preserve native Vision OCR diagnostics
        if: always() && github.event_name == 'workflow_dispatch' && inputs.vision_ocr_diagnostics
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: vision-ocr-diagnostics
          path: build/vision-ocr
          if-no-files-found: warn

      - name: Import smoke
        run: >-
          uv run python -c
          "import bd_to_avp; import bd_to_avp.__main__; import bd_to_avp.app"

      - name: CLI-only install smoke
        env:
          UV_PROJECT_ENVIRONMENT: .venv-cli
        run: |
          uv sync --locked --no-default-groups --no-editable --python 3.12
          .venv-cli/bin/python -c \
            "import importlib.util; assert importlib.util.find_spec('PySide6') is None"
          .venv-cli/bin/bd-to-avp --version
          .venv-cli/bin/bd-to-avp --help >/dev/null
          if OUTPUT=$(.venv-cli/bin/bd-to-avp 2>&1); then
            echo "CLI-only install unexpectedly started the GUI." >&2
            exit 1
          fi
          grep -F 'bd_to_avp[gui]' <<< "$OUTPUT"

      - name: Build Python package
        run: uv build

  native:
    name: Mac app
    needs: lanes
    if: needs.lanes.outputs.native == 'true'
    runs-on: xcode-27
    timeout-minutes: 30
    steps:
      - name: Check out repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Set up uv
        # Trusted toolchain publisher for uv; see CodeQL alert triage from 2026-07-07.
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked --all-groups --python 3.12

      - name: Rebuild bundled edge264 with release toolchain
        env:
          DEVELOPER_DIR: /Applications/Xcode_27.0.app/Contents/Developer
        run: |
          uv run python scripts/build_edge264_macos.py --output "$RUNNER_TEMP/edge264_test"
          cmp bd_to_avp/bin/edge264_test "$RUNNER_TEMP/edge264_test"

      - name: Rebuild bundled Swift tools with release toolchain
        env:
          DEVELOPER_DIR: /Applications/Xcode_27.0.app/Contents/Developer
        run: |
          for tool in fx-upscale spatial-media-kit-tool; do
            uv run python scripts/build_swift_tool_macos.py "$tool" --output "$RUNNER_TEMP/$tool"
            cmp "bd_to_avp/bin/$tool" "$RUNNER_TEMP/$tool"
          done

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Identify compilation cache inputs
        id: compilation-inputs
        env:
          DEVELOPER_DIR: /Applications/Xcode_27.0.app/Contents/Developer
        run: |
          set -euo pipefail
          echo "toolchain=$(xcodebuild -version | shasum -a 256 | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          echo "sources=$(git rev-parse HEAD:macos)" >> "$GITHUB_OUTPUT"

      - name: Restore test compilation cache
        id: compilation-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/native-compilation-cache.noindex
          key: compilation-v1-native-${{ runner.os }}-${{ runner.arch }}-${{ steps.compilation-inputs.outputs.toolchain }}-${{ hashFiles('macos/project.yml', '.github/ci-compilation-cache.xcconfig') }}-${{ steps.compilation-inputs.outputs.sources }}
          restore-keys: |
            compilation-v1-native-${{ runner.os }}-${{ runner.arch }}-${{ steps.compilation-inputs.outputs.toolchain }}-${{ hashFiles('macos/project.yml', '.github/ci-compilation-cache.xcconfig') }}-

      - name: macOS app tests
        env:
          DEVELOPER_DIR: /Applications/Xcode_27.0.app/Contents/Developer
          XCODE_XCCONFIG_FILE: ${{ github.workspace }}/.github/ci-compilation-cache.xcconfig
          CI_COMPILATION_CACHE_PATH: ${{ runner.temp }}/native-compilation-cache.noindex
        run: uv run python scripts/native_app.py test

      - name: Save test compilation cache
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.compilation-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/native-compilation-cache.noindex
          key: ${{ steps.compilation-cache.outputs.cache-primary-key }}

      - name: Package native macOS app smoke
        env:
          BD_TO_AVP_SUPPORT_DIAGNOSTICS_ENDPOINT: https://diagnostics.shinycomputers.com
          DEVELOPER_DIR: /Applications/Xcode_27.0.app/Contents/Developer
        run: uv run python scripts/native_app.py package

      - name: Installed Mac UI smoke
        id: installed-ui
        timeout-minutes: 10
        env:
          DEVELOPER_DIR: /Applications/Xcode_27.0.app/Contents/Developer
        run: |
          set -euo pipefail
          uv run python -m scripts.pre_signing_ui \
            --app "macos/build/package/3D Blu-ray to Vision Pro.app" \
            --dmg "$RUNNER_TEMP/ci-installed-ui.dmg" \
            --qualification-root "$RUNNER_TEMP/ci-installed-ui" \
            --evidence-directory "$RUNNER_TEMP/ci-installed-ui-evidence" \
            --output-report "$RUNNER_TEMP/ci-installed-ui-report.json" \
            --failure-diagnostics-directory "$RUNNER_TEMP/ci-installed-ui-diagnostics" \
            --source-sha "$(git rev-parse HEAD)" \
            --workflow-run-id "$GITHUB_RUN_ID" \
            --workflow-run-attempt "$GITHUB_RUN_ATTEMPT"

      - name: Retain installed Mac UI evidence
        if: always() && steps.installed-ui.outcome != 'skipped'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ci-installed-ui-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/ci-installed-ui-report.json
            ${{ runner.temp }}/ci-installed-ui-evidence
            ${{ runner.temp }}/ci-installed-ui-diagnostics
          if-no-files-found: ignore
          retention-days: 7

      - name: Verify bundled tools and deployment targets
        run: uv run python scripts/verify_app_tools.py

  player:
    name: visionOS player
    needs: lanes
    if: needs.lanes.outputs.player == 'true'
    runs-on: xcode-27
    # Measured on hosted runners: about 1 min setup and build, 4-5.5 min to create and boot the
    # simulator, 2 min to launch the test runner, and 1-4 min per UI test (7 min at worst). With
    # every UI test attempt stopped at its 5-minute allowance below, the step ends by about
    # 30 min, so 40 leaves room without letting a hang hold the train.
    timeout-minutes: 40
    steps:
      - name: Check out repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Set up uv
        # Trusted toolchain publisher for uv; see CodeQL alert triage from 2026-07-07.
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked --all-groups --python 3.12

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Identify compilation cache inputs
        id: compilation-inputs
        env:
          DEVELOPER_DIR: /Applications/Xcode_27.0.app/Contents/Developer
        run: |
          set -euo pipefail
          echo "toolchain=$(xcodebuild -version | shasum -a 256 | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          echo "sources=$(git rev-parse HEAD:macos)" >> "$GITHUB_OUTPUT"

      - name: Restore test compilation cache
        id: compilation-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/player-compilation-cache.noindex
          key: compilation-v1-player-${{ runner.os }}-${{ runner.arch }}-${{ steps.compilation-inputs.outputs.toolchain }}-${{ hashFiles('macos/project.yml', '.github/ci-compilation-cache.xcconfig') }}-${{ steps.compilation-inputs.outputs.sources }}
          restore-keys: |
            compilation-v1-player-${{ runner.os }}-${{ runner.arch }}-${{ steps.compilation-inputs.outputs.toolchain }}-${{ hashFiles('macos/project.yml', '.github/ci-compilation-cache.xcconfig') }}-

      - name: Build and conditionally test BDToAVPPlayer visionOS bundle
        env:
          DEVELOPER_DIR: /Applications/Xcode_27.0.app/Contents/Developer
          XCODE_XCCONFIG_FILE: ${{ github.workspace }}/.github/ci-compilation-cache.xcconfig
          CI_COMPILATION_CACHE_PATH: ${{ runner.temp }}/player-compilation-cache.noindex
        run: |
          set -euo pipefail
          cd macos
          export DEVELOPER_DIR="/Applications/Xcode_27.0.app/Contents/Developer"
          test -x "$DEVELOPER_DIR/usr/bin/xcodebuild"
          test "$(xcodebuild -version | sed -n '1p')" = "Xcode 27.0"
          xcodegen generate --spec project.yml
          xcodebuild build-for-testing \
            -project BluRayToVisionPro.xcodeproj \
            -scheme BDToAVPPlayer \
            -configuration Debug \
            -destination "generic/platform=visionOS Simulator" \
            -derivedDataPath build/BDToAVPPlayerDerivedData \
            CODE_SIGNING_ALLOWED=NO

          runtime_id="$(xcrun simctl list runtimes -j | jq -r '
            [.runtimes[]
              | select(.isAvailable == true)
              | select(.platform == "visionOS" or (.name | startswith("visionOS")))
              | select((.version | split(".")[0] | tonumber) >= 26)
              | .identifier]
            | first // empty
          ')"
          device_type_id="$(xcrun simctl list devicetypes -j | jq -r '
            [.devicetypes[] | select(.name == "Apple Vision Pro") | .identifier]
            | first // empty
          ')"

          if [[ -z "$runtime_id" || -z "$device_type_id" ]]; then
            echo "::notice::Skipping BDToAVPPlayer visionOS unit tests: an available visionOS 26+ runtime and Apple Vision Pro device type are required (runtime=${runtime_id:-none}, device_type=${device_type_id:-none})."
            exit 0
          fi

          simulator_name="BDToAVPPlayer CI ${GITHUB_RUN_ID:-local}-${GITHUB_RUN_ATTEMPT:-1}"
          simulator_udid="$(xcrun simctl create "$simulator_name" "$device_type_id" "$runtime_id")"
          cleanup_simulator() {
            xcrun simctl shutdown "$simulator_udid" >/dev/null 2>&1 || true
            xcrun simctl delete "$simulator_udid" >/dev/null 2>&1 || true
          }
          trap cleanup_simulator EXIT INT TERM

          xcrun simctl boot "$simulator_udid"
          xcrun simctl bootstatus "$simulator_udid" -b
          # The simulator sometimes fails to launch the UI test runner. Retry a failed test once
          # in a fresh process, and skip the sysdiagnose that used to add a 600 s timeout.
          # Stop any test that runs past 5 minutes so a hung UI query fails and is retried
          # instead of using up the job; passing UI tests have taken 40 s to 4.6 min, once 7.
          xcodebuild test-without-building \
            -project BluRayToVisionPro.xcodeproj \
            -scheme BDToAVPPlayer \
            -configuration Debug \
            -destination "platform=visionOS Simulator,id=$simulator_udid" \
            -derivedDataPath build/BDToAVPPlayerDerivedData \
            -retry-tests-on-failure \
            -test-iterations 2 \
            -test-repetition-relaunch-enabled YES \
            -test-timeouts-enabled YES \
            -default-test-execution-time-allowance 300 \
            -maximum-test-execution-time-allowance 300 \
            -collect-test-diagnostics never \
            CODE_SIGNING_ALLOWED=NO

      - name: Save test compilation cache
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.compilation-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/player-compilation-cache.noindex
          key: ${{ steps.compilation-cache.outputs.cache-primary-key }}

  validate:
    # The one required check. A lane that was not needed is skipped, which passes.
    needs: [lanes, checks, native, player]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every selected lane to have passed
        env:
          RESULTS: >-
            ${{ needs.lanes.result }} ${{ needs.checks.result }}
            ${{ needs.native.result }} ${{ needs.player.result }}
        run: |
          echo "lane results: $RESULTS"
          for result in $RESULTS; do
            case "$result" in
              success|skipped) ;;
              *) echo "A lane did not pass: $result" >&2; exit 1 ;;
            esac
          done

      - name: Report pull request time against its budget
        if: always() && github.event_name == 'pull_request' && needs.lanes.outputs.started != ''
        env:
          STARTED: ${{ needs.lanes.outputs.started }}
          BUDGET_MINUTES: "15"
        run: |
          elapsed=$(( $(date +%s) - STARTED ))
          minutes=$(( elapsed / 60 ))
          seconds=$(( elapsed % 60 ))
          echo "CI took ${minutes}m ${seconds}s; the pull request budget is ${BUDGET_MINUTES}m." >> "$GITHUB_STEP_SUMMARY"
          if (( elapsed > BUDGET_MINUTES * 60 )); then
            echo "::warning title=CI over budget::CI took ${minutes}m ${seconds}s, over the ${BUDGET_MINUTES}-minute pull request budget."
          fi
