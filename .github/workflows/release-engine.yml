---
name: Signed release engine

"on":
  workflow_call:
    inputs:
      release_notes:
        description: Optional notes prepended to the generated GitHub release notes
        required: false
        type: string
      release_sha:
        description: Exact protected-main commit authorized by the operator entry
        required: true
        type: string
      operator_workflow_ref:
        description: Fully qualified operator workflow ref from the caller context
        required: true
        type: string
      operator_workflow_sha:
        description: Commit containing the operator workflow definition
        required: true
        type: string
      operator_run_id:
        description: Operator workflow run ID
        required: true
        type: string
      operator_run_attempt:
        description: Operator workflow run attempt
        required: true
        type: string
      operator_actor:
        description: Account that dispatched the operator workflow
        required: true
        type: string
      operator_triggering_actor:
        description: Account that triggered this run attempt
        required: true
        type: string
    secrets:
      APPLE_ID:
        description: Apple ID supplied by the macos-signing environment
        required: false
      CERTIFICATE:
        description: Base64 PKCS#12 identity supplied by the macos-signing environment
        required: false
      CERTIFICATE_PASSWORD:
        description: PKCS#12 password supplied by the macos-signing environment
        required: false
      DEV_ID:
        description: Developer ID identity supplied by the macos-signing environment
        required: false
      KEYCHAIN_PASSWORD:
        description: Apple app-specific password supplied by the macos-signing environment
        required: false
      SPARKLE_EDDSA_PRIVATE_KEY:
        description: Sparkle signing key supplied by the sparkle-release environment
        required: false
      TEAM_ID:
        description: Apple team ID supplied by the macos-signing environment
        required: false
    outputs:
      package_version:
        description: Validated Python package version
        value: ${{ jobs.prepare.outputs.package_version }}
      public_version:
        description: Validated public release version
        value: ${{ jobs.prepare.outputs.public_version }}
      build_version:
        description: Validated global application build number
        value: ${{ jobs.prepare.outputs.build_version }}
      release_tag:
        description: Validated public release tag
        value: ${{ jobs.prepare.outputs.release_tag }}
      release_name:
        description: Validated public release title
        value: ${{ jobs.prepare.outputs.release_name }}
      dmg_name:
        description: Validated public DMG asset name
        value: ${{ jobs.prepare.outputs.dmg_name }}
      channel:
        description: Validated Sparkle release channel
        value: ${{ jobs.prepare.outputs.channel }}
      prerelease:
        description: Whether the release is a GitHub prerelease
        value: ${{ jobs.prepare.outputs.prerelease }}
      make_latest:
        description: GitHub latest-release policy
        value: ${{ jobs.prepare.outputs.make_latest }}
      publish_pypi:
        description: Whether the Stable operator must publish to PyPI
        value: ${{ jobs.prepare.outputs.publish_pypi }}
      python_artifact_digest:
        description: GitHub artifact digest for the checksummed Python distributions
        value: ${{ jobs.build-python.outputs.artifact_digest }}
      python_artifact_id:
        description: Immutable GitHub artifact ID for the checksummed Python distributions
        value: ${{ jobs.build-python.outputs.artifact_id }}
      release_policy_fingerprint:
        description: Fingerprint binding the operator run to this engine execution
        value: ${{ jobs.policy.outputs.policy_fingerprint }}
      release_route:
        description: Trusted Stable or Prerelease route derived from the operator workflow path
        value: ${{ jobs.policy.outputs.release_route }}
      operator_workflow_path:
        description: Validated operator workflow path
        value: ${{ jobs.policy.outputs.operator_workflow_path }}
      operator_workflow_ref:
        description: Validated operator workflow ref
        value: ${{ jobs.policy.outputs.operator_workflow_ref }}
      operator_workflow_sha:
        description: Validated operator workflow definition commit
        value: ${{ jobs.policy.outputs.operator_workflow_sha }}
      engine_workflow_ref:
        description: Validated reusable engine workflow ref
        value: ${{ jobs.policy.outputs.engine_workflow_ref }}
      engine_workflow_sha:
        description: Validated reusable engine workflow definition commit
        value: ${{ jobs.policy.outputs.engine_workflow_sha }}
      release_sha:
        description: Validated protected-main release commit
        value: ${{ jobs.policy.outputs.release_sha }}
      release_receipt_asset_id:
        description: Immutable GitHub Release asset ID for the public-safe release receipt
        value: ${{ jobs.build-receipt.outputs.receipt_asset_id }}
      release_receipt_sha256:
        description: SHA-256 of the exact uploaded release receipt file
        value: ${{ jobs.build-receipt.outputs.receipt_file_sha256 }}

permissions:
  actions: read
  contents: read

env:
  GH_REPO: ${{ github.repository }}
  RELEASE_QUALIFICATION_EVIDENCE: docs/qualification/release-evidence-v1.json
  RELEASE_QUALIFICATION_POLICY: docs/qualification/release-qualification-policy-v1.json
  RELEASE_QUALIFICATION_RECORD: docs/qualification/stable-signed-qualification-v1.json
  XCODEGEN_VERSION: 2.45.4
  XCODEGEN_SHA256: 090ec29491aad50aec10631bf6e62253fed733c50f3aab0f5ffc86bc170bdbef
  XCODE_VERSION: "26.5"
  XCODE_BUILD_VERSION: 17F42

jobs:
  policy:
    name: Bind operator and reusable workflow identity
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      id-token: write
    outputs:
      policy_fingerprint: ${{ steps.policy.outputs.policy_fingerprint }}
      release_route: ${{ steps.policy.outputs.release_route }}
      operator_workflow_path: ${{ steps.policy.outputs.operator_workflow_path }}
      operator_workflow_ref: ${{ steps.policy.outputs.operator_workflow_ref }}
      operator_workflow_sha: ${{ steps.policy.outputs.operator_workflow_sha }}
      engine_workflow_ref: ${{ steps.policy.outputs.engine_workflow_ref }}
      engine_workflow_sha: ${{ steps.policy.outputs.engine_workflow_sha }}
      release_sha: ${{ steps.policy.outputs.release_sha }}
    steps:
      - name: Require a protected release operator context
        env:
          ACTUAL_REPOSITORY: ${{ github.repository }}
          ACTUAL_EVENT_NAME: ${{ github.event_name }}
          ACTUAL_REF: ${{ github.ref }}
          ACTUAL_SHA: ${{ github.sha }}
          ACTUAL_OPERATOR_WORKFLOW_REF: ${{ github.workflow_ref }}
          ACTUAL_OPERATOR_WORKFLOW_SHA: ${{ github.workflow_sha }}
          ACTUAL_RUN_ID: ${{ github.run_id }}
          ACTUAL_RUN_ATTEMPT: ${{ github.run_attempt }}
          ACTUAL_ACTOR: ${{ github.actor }}
          ACTUAL_TRIGGERING_ACTOR: ${{ github.triggering_actor }}
          INPUT_RELEASE_SHA: ${{ inputs.release_sha }}
          INPUT_OPERATOR_WORKFLOW_REF: ${{ inputs.operator_workflow_ref }}
          INPUT_OPERATOR_WORKFLOW_SHA: ${{ inputs.operator_workflow_sha }}
          INPUT_OPERATOR_RUN_ID: ${{ inputs.operator_run_id }}
          INPUT_OPERATOR_RUN_ATTEMPT: ${{ inputs.operator_run_attempt }}
          INPUT_OPERATOR_ACTOR: ${{ inputs.operator_actor }}
          INPUT_OPERATOR_TRIGGERING_ACTOR: ${{ inputs.operator_triggering_actor }}
        run: |
          set -euo pipefail
          STABLE_OPERATOR_REF="cbusillo/BD_to_AVP/.github/workflows/briefcase.yml@refs/heads/main"
          PRERELEASE_OPERATOR_REF="cbusillo/BD_to_AVP/.github/workflows/prerelease.yml@refs/heads/main"
          test "$ACTUAL_REPOSITORY" = "cbusillo/BD_to_AVP"
          test "$ACTUAL_EVENT_NAME" = "workflow_dispatch"
          test "$ACTUAL_REF" = "refs/heads/main"
          case "$ACTUAL_OPERATOR_WORKFLOW_REF" in
            "$STABLE_OPERATOR_REF"|"$PRERELEASE_OPERATOR_REF") ;;
            *) echo "Unapproved release operator workflow." >&2; exit 1 ;;
          esac
          test "$ACTUAL_OPERATOR_WORKFLOW_SHA" = "$ACTUAL_SHA"
          test "$ACTUAL_ACTOR" = "shiny-code-bot"
          test "$ACTUAL_TRIGGERING_ACTOR" = "shiny-code-bot"
          test "$INPUT_RELEASE_SHA" = "$ACTUAL_SHA"
          test "$INPUT_OPERATOR_WORKFLOW_REF" = "$ACTUAL_OPERATOR_WORKFLOW_REF"
          test "$INPUT_OPERATOR_WORKFLOW_SHA" = "$ACTUAL_OPERATOR_WORKFLOW_SHA"
          test "$INPUT_OPERATOR_RUN_ID" = "$ACTUAL_RUN_ID"
          test "$INPUT_OPERATOR_RUN_ATTEMPT" = "$ACTUAL_RUN_ATTEMPT"
          test "$INPUT_OPERATOR_ACTOR" = "$ACTUAL_ACTOR"
          test "$INPUT_OPERATOR_TRIGGERING_ACTOR" = "$ACTUAL_TRIGGERING_ACTOR"

      - name: Checkout release policy from the authorized commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Reject direct invocation or operator policy bypass
        id: policy
        env:
          RELEASE_REPOSITORY: ${{ github.repository }}
          RELEASE_EVENT_NAME: ${{ github.event_name }}
          RELEASE_REF: ${{ github.ref }}
          RELEASE_SHA: ${{ github.sha }}
          RELEASE_OPERATOR_WORKFLOW_REF: ${{ github.workflow_ref }}
          RELEASE_OPERATOR_WORKFLOW_SHA: ${{ github.workflow_sha }}
          RELEASE_RUN_ID: ${{ github.run_id }}
          RELEASE_RUN_ATTEMPT: ${{ github.run_attempt }}
          RELEASE_ACTOR: ${{ github.actor }}
          RELEASE_TRIGGERING_ACTOR: ${{ github.triggering_actor }}
          INPUT_RELEASE_SHA: ${{ inputs.release_sha }}
          INPUT_OPERATOR_WORKFLOW_REF: ${{ inputs.operator_workflow_ref }}
          INPUT_OPERATOR_WORKFLOW_SHA: ${{ inputs.operator_workflow_sha }}
          INPUT_OPERATOR_RUN_ID: ${{ inputs.operator_run_id }}
          INPUT_OPERATOR_RUN_ATTEMPT: ${{ inputs.operator_run_attempt }}
          INPUT_OPERATOR_ACTOR: ${{ inputs.operator_actor }}
          INPUT_OPERATOR_TRIGGERING_ACTOR: ${{ inputs.operator_triggering_actor }}
        run: python3 scripts/release_workflow_policy.py engine --github-output "$GITHUB_OUTPUT"

  prepare:
    name: Validate release source and metadata
    needs: policy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: write
    outputs:
      package_version: ${{ steps.metadata.outputs.package_version }}
      public_version: ${{ steps.metadata.outputs.public_version }}
      build_version: ${{ steps.metadata.outputs.build_version }}
      release_tag: ${{ steps.metadata.outputs.release_tag }}
      release_name: ${{ steps.metadata.outputs.release_name }}
      dmg_name: ${{ steps.metadata.outputs.dmg_name }}
      channel: ${{ steps.metadata.outputs.channel }}
      prerelease: ${{ steps.metadata.outputs.prerelease }}
      first_candidate_of_cycle: ${{ steps.metadata.outputs.first_candidate_of_cycle }}
      make_latest: ${{ steps.metadata.outputs.make_latest }}
      publish_pypi: ${{ steps.metadata.outputs.publish_pypi }}
      previous_release_tag: ${{ steps.release_history.outputs.previous_release_tag }}
      base_snapshot_tag: ${{ steps.feed_state.outputs.base_snapshot_tag }}
    steps:
      - name: Checkout dispatch commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Require the current protected main commit
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "Releases must be dispatched from protected main." >&2
            exit 1
          fi
          if [ "$(git rev-parse HEAD)" != "$EXPECTED_SHA" ]; then
            echo "Checkout does not match github.sha." >&2
            exit 1
          fi
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          if [ "$(git rev-parse refs/remotes/origin/main)" != "$EXPECTED_SHA" ]; then
            echo "The dispatch commit is no longer the current main HEAD." >&2
            exit 1
          fi

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Derive committed release metadata
        id: metadata
        run: python -m scripts.release metadata --github-output "$GITHUB_OUTPUT"

      - name: Validate route and summarize publication effects
        env:
          RELEASE_OPERATOR_WORKFLOW_REF: ${{ needs.policy.outputs.operator_workflow_ref }}
          RELEASE_TAG: ${{ steps.metadata.outputs.release_tag }}
          RELEASE_CHANNEL: ${{ steps.metadata.outputs.channel }}
          RELEASE_PRERELEASE: ${{ steps.metadata.outputs.prerelease }}
          RELEASE_MAKE_LATEST: ${{ steps.metadata.outputs.make_latest }}
          RELEASE_PUBLISH_PYPI: ${{ steps.metadata.outputs.publish_pypi }}
        run: >-
          python scripts/release_workflow_policy.py metadata
          --github-step-summary "$GITHUB_STEP_SUMMARY"

      - name: Reject existing release identity
        env:
          EXPECTED_SHA: ${{ github.sha }}
          GH_TOKEN: ${{ github.token }}
          PRERELEASE: ${{ steps.metadata.outputs.prerelease }}
          RELEASE_NAME: ${{ steps.metadata.outputs.release_name }}
          RELEASE_TAG: ${{ steps.metadata.outputs.release_tag }}
        run: |
          set -euo pipefail
          TAG_REFS=$(git ls-remote --tags origin \
            "refs/tags/$RELEASE_TAG" \
            "refs/tags/$RELEASE_TAG^{}")
          TAG_SHA=$(awk '
            $2 ~ /\^\{\}$/ { peeled = $1 }
            $2 !~ /\^\{\}$/ { direct = $1 }
            END { print peeled != "" ? peeled : direct }
          ' <<< "$TAG_REFS")
          gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
            --paginate --slurp > release-identities.json
          RELEASE_COUNT=$(jq -r --arg tag "$RELEASE_TAG" \
            '[.[][] | select(.tag_name == $tag)] | length' \
            release-identities.json)
          if [ "$RELEASE_COUNT" = "0" ]; then
            if [ -n "$TAG_SHA" ]; then
              echo "Release tag already exists without a resumable draft: $RELEASE_TAG" >&2
              exit 1
            fi
          elif [ "$RELEASE_COUNT" = "1" ]; then
            RELEASE_JSON=$(jq -c --arg tag "$RELEASE_TAG" \
              '.[][] | select(.tag_name == $tag)' \
              release-identities.json)
            if [ "$(jq -r .draft <<< "$RELEASE_JSON")" != "true" ] \
              || [ "$(jq -r .target_commitish <<< "$RELEASE_JSON")" != "$EXPECTED_SHA" ] \
              || [ "$(jq -r .prerelease <<< "$RELEASE_JSON")" != "$PRERELEASE" ] \
              || [ "$(jq -r .name <<< "$RELEASE_JSON")" != "$RELEASE_NAME" ]; then
              echo "Existing release cannot be safely resumed: $RELEASE_TAG" >&2
              exit 1
            fi
            if [ -n "$TAG_SHA" ] && [ "$TAG_SHA" != "$EXPECTED_SHA" ]; then
              echo "Existing draft tag does not target the dispatch commit." >&2
              exit 1
            fi
          else
            echo "Multiple GitHub Releases use tag $RELEASE_TAG." >&2
            exit 1
          fi

      - name: Revalidate Beta 3 recovery premise
        if: steps.metadata.outputs.release_tag == 'v0.3.0-beta.3'
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          python -m scripts.beta3_recovery_evidence
          --allow-beta3-draft
          --allow-github-actions-contents-write-token
          --expected-sha "$GITHUB_SHA"

      - name: Resolve channel-aware base for generated notes
        id: release_history
        env:
          RELEASE_TAG: ${{ steps.metadata.outputs.release_tag }}
        run: |
          set -euo pipefail
          python -m scripts.release notes-base \
            --release-tag "$RELEASE_TAG" \
            --releases-json release-identities.json \
            --head-ref "$GITHUB_SHA" \
            --github-output "$GITHUB_OUTPUT"

      - name: Resolve active and durable appcast state
        id: feed_state
        env:
          BUILD_VERSION: ${{ steps.metadata.outputs.build_version }}
          GH_TOKEN: ${{ github.token }}
          SHORT_VERSION: ${{ steps.metadata.outputs.package_version }}
        run: |
          set -euo pipefail
          mkdir -p release-preflight/active release-preflight/latest

          fetch_url() {
            local url="$1"
            local output="$2"
            local status
            local exit_code
            set +e
            status=$(curl --location --silent --show-error \
              --retry 3 --retry-delay 2 --retry-all-errors \
              --connect-timeout 10 --max-time 45 \
              --output "$output" --write-out '%{http_code}' "$url")
            exit_code=$?
            set -e
            if [ "$exit_code" -ne 0 ]; then
              rm -f "$output"
              printf '000\n'
            else
              printf '%s\n' "$status"
            fi
          }

          gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
            --paginate --slurp > release-preflight/releases.json
          LATEST_SNAPSHOT_TAG=$(jq -r '
            [
              .[][]
              | select(.draft == false)
              | select(any(.assets[]?; .name == "appcast.xml"))
            ]
            | sort_by(.published_at)
            | reverse
            | .[0].tag_name // empty
          ' release-preflight/releases.json)

          CACHE_KEY="$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          STATE_STATUS=$(fetch_url \
            "https://cbusillo.github.io/BD_to_AVP/appcast-state.json?run=$CACHE_KEY" \
            release-preflight/appcast-state.json)
          if [ "$STATE_STATUS" = "200" ]; then
            if ! jq -e '
              type == "object"
              and .schema == 1
              and (
                .status == "disabled"
                or (
                  .status == "enabled"
                  and (.release_tag | type == "string")
                  and (.appcast_sha256 | test("^[0-9a-f]{64}$"))
                )
              )
            ' release-preflight/appcast-state.json >/dev/null; then
              echo "Published Sparkle state is invalid; restore a known-good snapshot." >&2
              exit 1
            fi
            if [ "$(jq -r .status release-preflight/appcast-state.json)" = "disabled" ]; then
              echo "Sparkle updates are disabled; restore a known-good snapshot before releasing." >&2
              exit 1
            fi

            BASE_SNAPSHOT_TAG=$(jq -r .release_tag release-preflight/appcast-state.json)
            STATE_APPCAST_SHA256=$(jq -r .appcast_sha256 release-preflight/appcast-state.json)
            python -m scripts.release validate-tag "$BASE_SNAPSHOT_TAG" >/dev/null
            BASE_RELEASE_COUNT=$(jq -r --arg tag "$BASE_SNAPSHOT_TAG" '
              [
                .[][]
                | select(.draft == false and .tag_name == $tag)
                | select(any(.assets[]?; .name == "appcast.xml"))
              ]
              | length
            ' release-preflight/releases.json)
            if [ "$BASE_RELEASE_COUNT" != "1" ]; then
              echo "Published Sparkle state does not name one durable release snapshot." >&2
              exit 1
            fi
            gh release download "$BASE_SNAPSHOT_TAG" \
              --pattern appcast.xml \
              --dir release-preflight/active
            python scripts/sparkle_appcast.py validate-snapshot \
              --feed release-preflight/active/appcast.xml \
              --release-tag "$BASE_SNAPSHOT_TAG"
            ACTIVE_SHA256=$(sha256sum release-preflight/active/appcast.xml | awk '{print $1}')
            if [ "$ACTIVE_SHA256" != "$STATE_APPCAST_SHA256" ]; then
              echo "Published Sparkle state digest differs from its durable snapshot." >&2
              exit 1
            fi

            LIVE_STATUS=$(fetch_url \
              "https://cbusillo.github.io/BD_to_AVP/appcast.xml?run=$CACHE_KEY" \
              release-preflight/live-appcast.xml)
            if [ "$LIVE_STATUS" != "200" ]; then
              echo "Unable to verify the active Sparkle feed; HTTP $LIVE_STATUS." >&2
              exit 1
            fi
            python scripts/sparkle_appcast.py validate \
              --feed release-preflight/live-appcast.xml
            LIVE_SHA256=$(sha256sum release-preflight/live-appcast.xml | awk '{print $1}')
            if [ "$LIVE_SHA256" != "$STATE_APPCAST_SHA256" ]; then
              echo "Live Sparkle feed differs from the active durable snapshot." >&2
              exit 1
            fi
          elif [ "$STATE_STATUS" = "404" ]; then
            if [ -n "$LATEST_SNAPSHOT_TAG" ]; then
              echo "Sparkle state is missing despite durable snapshots; restore one before releasing." >&2
              exit 1
            fi
            BASE_SNAPSHOT_TAG=bootstrap
            LIVE_STATUS=$(fetch_url \
              "https://cbusillo.github.io/BD_to_AVP/appcast.xml?run=$CACHE_KEY" \
              release-preflight/active/appcast.xml)
            if [ "$LIVE_STATUS" = "200" ]; then
              python scripts/sparkle_appcast.py validate-empty \
                --feed release-preflight/active/appcast.xml
            elif [ "$LIVE_STATUS" = "404" ]; then
              cp sparkle-feed/appcast.xml release-preflight/active/appcast.xml
            else
              echo "Unable to verify bootstrap Sparkle feed; HTTP $LIVE_STATUS." >&2
              exit 1
            fi
          else
            echo "Unable to verify Sparkle deployment state; HTTP $STATE_STATUS." >&2
            exit 1
          fi

          python scripts/sparkle_appcast.py check-release \
            --feed release-preflight/active/appcast.xml \
            --build-version "$BUILD_VERSION" \
            --short-version "$SHORT_VERSION"

          if [ -n "$LATEST_SNAPSHOT_TAG" ] \
            && [ "$LATEST_SNAPSHOT_TAG" != "$BASE_SNAPSHOT_TAG" ]; then
            gh release download "$LATEST_SNAPSHOT_TAG" \
              --pattern appcast.xml \
              --dir release-preflight/latest
            python scripts/sparkle_appcast.py validate-snapshot \
              --feed release-preflight/latest/appcast.xml \
              --release-tag "$LATEST_SNAPSHOT_TAG"
            python scripts/sparkle_appcast.py check-release \
              --feed release-preflight/latest/appcast.xml \
              --build-version "$BUILD_VERSION" \
              --short-version "$SHORT_VERSION"
          fi
          echo "base_snapshot_tag=$BASE_SNAPSHOT_TAG" >> "$GITHUB_OUTPUT"

      - name: Reject an existing stable PyPI version
        if: steps.metadata.outputs.publish_pypi == 'true'
        env:
          PACKAGE_VERSION: ${{ steps.metadata.outputs.package_version }}
        run: |
          set -euo pipefail
          STATUS=$(curl --location --silent --output /dev/null --write-out '%{http_code}' \
            "https://pypi.org/pypi/bd-to-avp/$PACKAGE_VERSION/json")
          case "$STATUS" in
            404) ;;
            200)
              echo "PyPI version already exists: $PACKAGE_VERSION" >&2
              exit 1
              ;;
            *)
              echo "Unable to verify PyPI version availability; HTTP $STATUS." >&2
              exit 1
              ;;
          esac

  qualify-preparation:
    name: Qualify release preparation
    needs:
      - prepare
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout exact candidate and qualification evidence
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Classify preparation evidence
        id: qualification
        env:
          FIRST_CANDIDATE_OF_CYCLE: ${{ needs.prepare.outputs.first_candidate_of_cycle }}
          RELEASE_STAGE: ${{ needs.prepare.outputs.channel }}
        run: |
          set -euo pipefail
          FIRST_CANDIDATE_ARGS=()
          if [ "$FIRST_CANDIDATE_OF_CYCLE" = "true" ]; then
            FIRST_CANDIDATE_ARGS+=(--first-candidate-of-cycle)
          fi
          set +e
          python -m scripts.qualify_release_scope \
            --policy "$RELEASE_QUALIFICATION_POLICY" \
            --qualification "$RELEASE_QUALIFICATION_RECORD" \
            --evidence "$RELEASE_QUALIFICATION_EVIDENCE" \
            --candidate-sha "$GITHUB_SHA" \
            --release-stage "$RELEASE_STAGE" \
            --workflow-phase preparation \
            "${FIRST_CANDIDATE_ARGS[@]}" \
            --output release-qualification-preparation.json \
            --require-evidence
          EXIT_CODE=$?
          set -e
          echo "exit_code=$EXIT_CODE" >> "$GITHUB_OUTPUT"

      - name: Retain preparation qualification report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-qualification-preparation-${{ github.run_attempt }}
          path: release-qualification-preparation.json
          if-no-files-found: warn
          retention-days: 30

      - name: Enforce preparation qualification
        if: always()
        env:
          QUALIFICATION_EXIT_CODE: ${{ steps.qualification.outputs.exit_code }}
        run: |
          set -euo pipefail
          if [ "$QUALIFICATION_EXIT_CODE" != "0" ]; then
            echo "Release preparation qualification failed with exit code $QUALIFICATION_EXIT_CODE." >&2
            exit "$QUALIFICATION_EXIT_CODE"
          fi

  package:
    name: Build, sign, notarize, and validate DMG
    needs:
      - policy
      - prepare
      - qualify-preparation
    runs-on: macos-26
    timeout-minutes: 180
    environment: macos-signing
    permissions:
      contents: read
    outputs:
      dmg_name: ${{ steps.package_artifact.outputs.dmg_name }}
      dmg_sha256: ${{ steps.package_artifact.outputs.dmg_sha256 }}
      dmg_size: ${{ steps.package_artifact.outputs.dmg_size }}
      signed_app_tree_sha256: ${{ steps.package_artifact.outputs.signed_app_tree_sha256 }}
    steps:
      - name: Checkout validated main commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Verify release runner and checkout
        env:
          EXPECTED_POLICY_FINGERPRINT: ${{ needs.policy.outputs.policy_fingerprint }}
          RELEASE_REPOSITORY: ${{ github.repository }}
          RELEASE_EVENT_NAME: ${{ github.event_name }}
          RELEASE_REF: ${{ github.ref }}
          RELEASE_SHA: ${{ github.sha }}
          RELEASE_OPERATOR_WORKFLOW_REF: ${{ github.workflow_ref }}
          RELEASE_OPERATOR_WORKFLOW_SHA: ${{ github.workflow_sha }}
          RELEASE_ENGINE_WORKFLOW_REF: ${{ needs.policy.outputs.engine_workflow_ref }}
          RELEASE_ENGINE_WORKFLOW_SHA: ${{ needs.policy.outputs.engine_workflow_sha }}
          RELEASE_ENGINE_WORKFLOW_REPOSITORY: ${{ github.repository }}
          RELEASE_RUN_ID: ${{ github.run_id }}
          RELEASE_RUN_ATTEMPT: ${{ github.run_attempt }}
          RELEASE_ACTOR: ${{ github.actor }}
          RELEASE_TRIGGERING_ACTOR: ${{ github.triggering_actor }}
          INPUT_RELEASE_SHA: ${{ inputs.release_sha }}
          INPUT_OPERATOR_WORKFLOW_REF: ${{ inputs.operator_workflow_ref }}
          INPUT_OPERATOR_WORKFLOW_SHA: ${{ inputs.operator_workflow_sha }}
          INPUT_OPERATOR_RUN_ID: ${{ inputs.operator_run_id }}
          INPUT_OPERATOR_RUN_ATTEMPT: ${{ inputs.operator_run_attempt }}
          INPUT_OPERATOR_ACTOR: ${{ inputs.operator_actor }}
          INPUT_OPERATOR_TRIGGERING_ACTOR: ${{ inputs.operator_triggering_actor }}
        run: |
          set -euo pipefail
          python3 scripts/release_workflow_policy.py engine \
            --expected-fingerprint "$EXPECTED_POLICY_FINGERPRINT"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          if [ "$(git rev-parse refs/remotes/origin/main)" != "$GITHUB_SHA" ]; then
            echo "Protected main moved after signing approval." >&2
            exit 1
          fi
          test "$(uname -m)" = "arm64"
          test "$(sw_vers -productVersion | cut -d. -f1)" = "26"
          XCODE_PATH="/Applications/Xcode_${XCODE_VERSION}.app/Contents/Developer"
          if [ ! -d "$XCODE_PATH" ]; then
            echo "Pinned Xcode path is unavailable: $XCODE_PATH" >&2
            exit 1
          fi
          sudo xcode-select -s "$XCODE_PATH"
          test "$(xcodebuild -version | sed -n '1p')" = "Xcode $XCODE_VERSION"
          test "$(xcodebuild -version | sed -n '2p')" = "Build version $XCODE_BUILD_VERSION"
          if [ -n "${BD_TO_AVP_MACOS_DEPLOYMENT_TARGET_OVERRIDE:-}" ]; then
            echo "Release builds must not override the macOS 26 deployment target." >&2
            exit 1
          fi

      - name: Install pinned XcodeGen
        run: |
          set -euo pipefail
          ARCHIVE="$RUNNER_TEMP/xcodegen.zip"
          curl --fail --location --silent --show-error \
            "https://github.com/yonaskolb/XcodeGen/releases/download/$XCODEGEN_VERSION/xcodegen.zip" \
            --output "$ARCHIVE"
          printf '%s  %s\n' "$XCODEGEN_SHA256" "$ARCHIVE" | shasum -a 256 --check
          ditto -x -k "$ARCHIVE" "$RUNNER_TEMP"
          test "$("$RUNNER_TEMP/xcodegen/bin/xcodegen" --version)" = "Version: $XCODEGEN_VERSION"
          echo "$RUNNER_TEMP/xcodegen/bin" >> "$GITHUB_PATH"

      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
          python-version: "3.12"

      - name: Install Python and locked dependencies
        run: |
          uv python install 3.12
          uv sync --locked --all-groups --python 3.12

      - name: Install signing certificate in an ephemeral keychain
        env:
          CERTIFICATE: ${{ secrets.CERTIFICATE }}
          CERTIFICATE_PASSWORD: ${{ secrets.CERTIFICATE_PASSWORD }}
          DEV_ID: ${{ secrets.DEV_ID }}
          PRODUCTION_DEV_ID: "Developer ID Application: Shiny Computers Leasing LLC (MM5YXC7T6E)"
          PRODUCTION_TEAM_ID: MM5YXC7T6E
          TEAM_ID: ${{ secrets.TEAM_ID }}
        run: |
          set -euo pipefail
          MISSING_SECRETS=()
          for secret_name in CERTIFICATE CERTIFICATE_PASSWORD DEV_ID TEAM_ID; do
            if [ -z "${!secret_name:-}" ]; then
              MISSING_SECRETS+=("$secret_name")
            fi
          done
          if [ "${#MISSING_SECRETS[@]}" -ne 0 ]; then
            printf 'Missing required macos-signing certificate secrets: %s\n' "${MISSING_SECRETS[*]}" >&2
            exit 1
          fi
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          if [ "$(git rev-parse refs/remotes/origin/main)" != "$GITHUB_SHA" ]; then
            echo "Protected main moved immediately before certificate use." >&2
            exit 1
          fi
          case "$TEAM_ID" in
            ""|*[!ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789]*)
              echo "TEAM_ID must be a 10-character Apple Team ID." >&2
              exit 1
              ;;
          esac
          if [ "${#TEAM_ID}" -ne 10 ]; then
            echo "TEAM_ID must be a 10-character Apple Team ID." >&2
            exit 1
          fi
          if [ "$TEAM_ID" != "$PRODUCTION_TEAM_ID" ]; then
            echo "TEAM_ID does not match the committed production Apple team." >&2
            exit 1
          fi
          if [ "$DEV_ID" != "$PRODUCTION_DEV_ID" ]; then
            echo "DEV_ID does not match the committed production Developer ID identity." >&2
            exit 1
          fi
          DEV_ID_PREFIX="Developer ID Application: "
          DEV_ID_SUFFIX=" ($TEAM_ID)"
          case "$DEV_ID" in
            "$DEV_ID_PREFIX"*"$DEV_ID_SUFFIX") ;;
            *)
              echo "DEV_ID must be a Developer ID Application identity ending in ($TEAM_ID)." >&2
              exit 1
              ;;
          esac
          DEV_ID_NAME=${DEV_ID#"$DEV_ID_PREFIX"}
          DEV_ID_NAME=${DEV_ID_NAME%"$DEV_ID_SUFFIX"}
          if [ -z "$DEV_ID_NAME" ]; then
            echo "DEV_ID must include a non-empty Developer ID subject." >&2
            exit 1
          fi

          BUILD_KEYCHAIN_PASSWORD=$(openssl rand -hex 32)
          KEYCHAIN_PATH="$RUNNER_TEMP/bd-to-avp-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT.keychain-db"
          CERTIFICATE_PATH="$RUNNER_TEMP/bd-to-avp-$GITHUB_RUN_ID.p12"
          USER_KEYCHAINS_PATH="$RUNNER_TEMP/bd-to-avp-user-keychains-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT.txt"
          USER_KEYCHAINS_TMP_PATH="${USER_KEYCHAINS_PATH}.tmp"
          echo "::add-mask::$BUILD_KEYCHAIN_PASSWORD"

          {
            echo "BUILD_KEYCHAIN_PASSWORD=$BUILD_KEYCHAIN_PASSWORD"
            echo "CERTIFICATE_PATH=$CERTIFICATE_PATH"
            echo "KEYCHAIN_PATH=$KEYCHAIN_PATH"
            echo "USER_KEYCHAINS_PATH=$USER_KEYCHAINS_PATH"
          } >> "$GITHUB_ENV"

          restore_user_keychains() {
            if [ ! -f "$USER_KEYCHAINS_PATH" ]; then
              return 0
            fi
            RESTORE_KEYCHAINS=()
            while IFS= read -r keychain; do
              if [ -n "$keychain" ]; then
                RESTORE_KEYCHAINS+=("$keychain")
              fi
            done < "$USER_KEYCHAINS_PATH"
            if [ "${#RESTORE_KEYCHAINS[@]}" -eq 0 ]; then
              security list-keychains -d user -s
            else
              security list-keychains -d user -s "${RESTORE_KEYCHAINS[@]}"
            fi
          }

          cleanup_on_failure() {
            status=$?
            trap - EXIT
            if [ "$status" -ne 0 ]; then
              restore_status=0
              restore_user_keychains >/dev/null 2>&1 || restore_status=$?
              if [ -e "$KEYCHAIN_PATH" ]; then
                security delete-keychain "$KEYCHAIN_PATH" >/dev/null 2>&1 || true
              fi
              rm -f "$CERTIFICATE_PATH" "$USER_KEYCHAINS_TMP_PATH" || true
              if [ "$restore_status" -eq 0 ]; then
                rm -f "$USER_KEYCHAINS_PATH" || true
              fi
            fi
            exit "$status"
          }
          trap cleanup_on_failure EXIT

          rm -f "$USER_KEYCHAINS_PATH" "$USER_KEYCHAINS_TMP_PATH"
          security list-keychains -d user \
            | sed -E 's/^[[:space:]]*"//; s/"[[:space:]]*$//' \
            > "$USER_KEYCHAINS_TMP_PATH"
          mv "$USER_KEYCHAINS_TMP_PATH" "$USER_KEYCHAINS_PATH"
          security create-keychain -p "$BUILD_KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          USER_KEYCHAINS=()
          while IFS= read -r keychain; do
            if [ -n "$keychain" ]; then
              USER_KEYCHAINS+=("$keychain")
            fi
          done < "$USER_KEYCHAINS_PATH"
          if [ "${#USER_KEYCHAINS[@]}" -eq 0 ]; then
            security list-keychains -d user -s "$KEYCHAIN_PATH"
          else
            security list-keychains -d user -s "$KEYCHAIN_PATH" "${USER_KEYCHAINS[@]}"
          fi
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$BUILD_KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          printf '%s' "$CERTIFICATE" | base64 --decode > "$CERTIFICATE_PATH"
          security import "$CERTIFICATE_PATH" -k "$KEYCHAIN_PATH" -P "$CERTIFICATE_PASSWORD" \
            -T "/usr/bin/codesign"
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s -k "$BUILD_KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user | grep -F "$KEYCHAIN_PATH"
          if ! security find-identity -v -p codesigning "$KEYCHAIN_PATH" \
            | awk -F '"' -v identity="$DEV_ID" '$2 == identity { found=1 } END { exit found ? 0 : 1 }'; then
            echo "Configured Developer ID identity was not found in the ephemeral keychain." >&2
            exit 1
          fi
          trap - EXIT

      - name: Store notarization credentials in the ephemeral keychain
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
          TEAM_ID: ${{ secrets.TEAM_ID }}
        run: |
          set -euo pipefail
          MISSING_SECRETS=()
          if [ -z "$APPLE_ID" ]; then
            MISSING_SECRETS+=("APPLE_ID")
          fi
          if [ -z "$APPLE_APP_PASSWORD" ]; then
            MISSING_SECRETS+=("KEYCHAIN_PASSWORD")
          fi
          if [ -z "$TEAM_ID" ]; then
            MISSING_SECRETS+=("TEAM_ID")
          fi
          if [ "${#MISSING_SECRETS[@]}" -ne 0 ]; then
            printf 'Missing required macos-signing notarization secrets: %s\n' "${MISSING_SECRETS[*]}" >&2
            exit 1
          fi
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          if [ "$(git rev-parse refs/remotes/origin/main)" != "$GITHUB_SHA" ]; then
            echo "Protected main moved immediately before notarization credential use." >&2
            exit 1
          fi
          NOTARY_PROFILE="bd-to-avp-release-$TEAM_ID-$GITHUB_RUN_ID"
          security unlock-keychain -p "$BUILD_KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          xcrun notarytool store-credentials "$NOTARY_PROFILE" \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_APP_PASSWORD" \
            --team-id "$TEAM_ID" \
            --keychain "$KEYCHAIN_PATH"
          echo "NOTARY_PROFILE=$NOTARY_PROFILE" >> "$GITHUB_ENV"

      - name: Package application for GitHub
        id: package_artifact
        env:
          BD_TO_AVP_MACOS_DEPLOYMENT_TARGET_OVERRIDE: ""
          BD_TO_AVP_SUPPORT_DIAGNOSTICS_ENDPOINT: ${{ vars.SUPPORT_DIAGNOSTICS_ENDPOINT }}
          BUILD_VERSION: ${{ needs.prepare.outputs.build_version }}
          DEV_ID: ${{ secrets.DEV_ID }}
          DMG_NAME: ${{ needs.prepare.outputs.dmg_name }}
          PACKAGE_VERSION: ${{ needs.prepare.outputs.package_version }}
          PRODUCTION_DEV_ID: "Developer ID Application: Shiny Computers Leasing LLC (MM5YXC7T6E)"
          PRODUCTION_TEAM_ID: MM5YXC7T6E
          TEAM_ID: ${{ secrets.TEAM_ID }}
        run: |
          set -euo pipefail
          verify_codesign_metadata() {
            signed_path=$1
            signed_label=$2
            metadata_path=$3
            if ! codesign -dv --verbose=4 "$signed_path" > "$metadata_path" 2>&1; then
              echo "$signed_label code-signature metadata inspection failed." >&2
              exit 1
            fi
            signing_authority=$(awk -F= '$1 == "Authority" { print substr($0, index($0, "=") + 1); exit }' "$metadata_path")
            team_identifier=$(awk -F= '$1 == "TeamIdentifier" { print substr($0, index($0, "=") + 1); exit }' "$metadata_path")
            if [ -z "$signing_authority" ]; then
              echo "$signed_label code signature did not report a signing authority." >&2
              exit 1
            fi
            if [ "$signing_authority" != "$DEV_ID" ]; then
              echo "$signed_label signing authority does not match the configured Developer ID identity." >&2
              exit 1
            fi
            if [ -z "$team_identifier" ]; then
              echo "$signed_label code signature did not report a TeamIdentifier." >&2
              exit 1
            fi
            if [ "$team_identifier" != "$PRODUCTION_TEAM_ID" ]; then
              echo "$signed_label TeamIdentifier does not match the committed production Team ID." >&2
              exit 1
            fi
          }

          validate_signing_identity() {
            case "$TEAM_ID" in
              ""|*[!ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789]*)
                echo "TEAM_ID must be a 10-character Apple Team ID." >&2
                exit 1
                ;;
            esac
            if [ "${#TEAM_ID}" -ne 10 ]; then
              echo "TEAM_ID must be a 10-character Apple Team ID." >&2
              exit 1
            fi
            if [ "$TEAM_ID" != "$PRODUCTION_TEAM_ID" ]; then
              echo "TEAM_ID does not match the committed production Apple team." >&2
              exit 1
            fi
            if [ "$DEV_ID" != "$PRODUCTION_DEV_ID" ]; then
              echo "DEV_ID does not match the committed production Developer ID identity." >&2
              exit 1
            fi
            DEV_ID_PREFIX="Developer ID Application: "
            DEV_ID_SUFFIX=" ($TEAM_ID)"
            case "$DEV_ID" in
              "$DEV_ID_PREFIX"*"$DEV_ID_SUFFIX") ;;
              *)
                echo "DEV_ID must be a Developer ID Application identity ending in ($TEAM_ID)." >&2
                exit 1
                ;;
            esac
            DEV_ID_NAME=${DEV_ID#"$DEV_ID_PREFIX"}
            DEV_ID_NAME=${DEV_ID_NAME%"$DEV_ID_SUFFIX"}
            if [ -z "$DEV_ID_NAME" ]; then
              echo "DEV_ID must include a non-empty Developer ID subject." >&2
              exit 1
            fi
          }

          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          if [ "$(git rev-parse refs/remotes/origin/main)" != "$GITHUB_SHA" ]; then
            echo "Protected main moved immediately before package signing." >&2
            exit 1
          fi
          validate_signing_identity
          security unlock-keychain -p "$BUILD_KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          APP_PATH="macos/build/package/3D Blu-ray to Vision Pro.app"
          DMG_PATH="dist/$DMG_NAME"
          APP_ARCHIVE="$RUNNER_TEMP/bd-to-avp-app-$GITHUB_RUN_ID.zip"
          mkdir -p dist/notary

          uv run python scripts/native_app.py package \
            --sign-identity "$DEV_ID" \
            --sign-keychain "$KEYCHAIN_PATH"
          verify_codesign_metadata \
            "$APP_PATH" \
            "Containing app" \
            "$RUNNER_TEMP/bd-to-avp-app-codesign-$GITHUB_RUN_ID.txt"
          uv run python -m scripts.macos_release verify-app \
            --app "$APP_PATH" \
            --verify-signatures \
            > dist/macos-app-metadata.json
          if [ "$(jq -r .short_version dist/macos-app-metadata.json)" != "$PACKAGE_VERSION" ]; then
            echo "Built app version does not match $PACKAGE_VERSION." >&2
            exit 1
          fi
          if [ "$(jq -r .build_version dist/macos-app-metadata.json)" != "$BUILD_VERSION" ]; then
            echo "Built app build does not match $BUILD_VERSION." >&2
            exit 1
          fi

          ditto -c -k --keepParent "$APP_PATH" "$APP_ARCHIVE"
          uv run python -m scripts.macos_release notarize \
            --submission "$APP_ARCHIVE" \
            --staple "$APP_PATH" \
            --keychain-profile "$NOTARY_PROFILE" \
            --keychain "$KEYCHAIN_PATH" \
            --log dist/notary/app-notary.json
          uv run python -m scripts.macos_release verify-app \
            --app "$APP_PATH" \
            --verify-signatures \
            --verify-distribution \
            --smoke-worker \
            > dist/macos-app-metadata.json

          uv run python -m scripts.macos_release create-dmg \
            --app "$APP_PATH" \
            --output "$DMG_PATH"
          codesign --force --timestamp --sign "$DEV_ID" --keychain "$KEYCHAIN_PATH" "$DMG_PATH"
          verify_codesign_metadata \
            "$DMG_PATH" \
            "DMG" \
            "$RUNNER_TEMP/bd-to-avp-dmg-codesign-$GITHUB_RUN_ID.txt"
          uv run python -m scripts.macos_release notarize \
            --submission "$DMG_PATH" \
            --staple "$DMG_PATH" \
            --keychain-profile "$NOTARY_PROFILE" \
            --keychain "$KEYCHAIN_PATH" \
            --log dist/notary/dmg-notary.json
          uv run python -m scripts.macos_release verify-dmg \
            --dmg "$DMG_PATH" \
            --verify-signatures \
            --verify-distribution \
            --smoke-worker \
            > dist/macos-release-metadata.json
          if ! jq -se '
            length == 1
            and (.[0] | type == "object")
            and (.[0].short_version | type == "string")
            and (.[0].build_version | type == "string")
          ' dist/macos-release-metadata.json > /dev/null; then
            echo "Packaged DMG metadata is not a single valid JSON object." >&2
            exit 1
          fi
          if [ "$(jq -r .short_version dist/macos-release-metadata.json)" != "$PACKAGE_VERSION" ]; then
            echo "Packaged DMG version does not match $PACKAGE_VERSION." >&2
            exit 1
          fi
          if [ "$(jq -r .build_version dist/macos-release-metadata.json)" != "$BUILD_VERSION" ]; then
            echo "Packaged DMG build does not match $BUILD_VERSION." >&2
            exit 1
          fi
          DMG_SHA256=$(shasum -a 256 "$DMG_PATH" | awk '{print $1}')
          DMG_SIZE=$(stat -f %z "$DMG_PATH")
          SIGNED_APP_TREE_SHA256=$(uv run python -c \
            'from pathlib import Path; from scripts.artifact_identity import app_tree_sha256; print(app_tree_sha256(Path("macos/build/package/3D Blu-ray to Vision Pro.app")))')
          printf '%s  %s\n' "$DMG_SHA256" "$DMG_NAME" > dist/SHA256SUMS
          {
            echo "dmg_name=$DMG_NAME"
            echo "dmg_sha256=$DMG_SHA256"
            echo "dmg_size=$DMG_SIZE"
            echo "signed_app_tree_sha256=$SIGNED_APP_TREE_SHA256"
          } >> "$GITHUB_OUTPUT"

      - name: Upload log on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: macos-release-diagnostics
          path: |
            dist/notary/*.json
            logs/briefcase.*.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Remove temporary signing material
        if: always()
        run: |
          set +e
          cleanup_status=0
          restore_status=0
          KEYCHAIN_PATH="${KEYCHAIN_PATH:-$RUNNER_TEMP/bd-to-avp-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT.keychain-db}"
          CERTIFICATE_PATH="${CERTIFICATE_PATH:-$RUNNER_TEMP/bd-to-avp-$GITHUB_RUN_ID.p12}"
          USER_KEYCHAINS_PATH="${USER_KEYCHAINS_PATH:-$RUNNER_TEMP/bd-to-avp-user-keychains-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT.txt}"
          USER_KEYCHAINS_TMP_PATH="${USER_KEYCHAINS_PATH}.tmp"
          restore_user_keychains() {
            if [ ! -f "$USER_KEYCHAINS_PATH" ]; then
              return 0
            fi
            RESTORE_KEYCHAINS=()
            while IFS= read -r keychain; do
              if [ -n "$keychain" ]; then
                RESTORE_KEYCHAINS+=("$keychain")
              fi
            done < "$USER_KEYCHAINS_PATH"
            if [ "${#RESTORE_KEYCHAINS[@]}" -eq 0 ]; then
              security list-keychains -d user -s
            else
              security list-keychains -d user -s "${RESTORE_KEYCHAINS[@]}"
            fi
          }
          if ! restore_user_keychains >/dev/null 2>&1; then
            echo "Failed to restore the user keychain search list." >&2
            restore_status=1
            cleanup_status=1
          fi
          if [ -e "$KEYCHAIN_PATH" ] && ! security delete-keychain "$KEYCHAIN_PATH" >/dev/null 2>&1; then
            echo "Failed to delete the ephemeral signing keychain." >&2
            cleanup_status=1
          fi
          if ! rm -f \
            "${CERTIFICATE_PATH:-}" \
            "$USER_KEYCHAINS_TMP_PATH" \
            "$RUNNER_TEMP/bd-to-avp-app-$GITHUB_RUN_ID.zip"
          then
            echo "Failed to remove temporary signing files." >&2
            cleanup_status=1
          fi
          if [ "$restore_status" -eq 0 ] && ! rm -f "$USER_KEYCHAINS_PATH"; then
            echo "Failed to remove the keychain search-list snapshot." >&2
            cleanup_status=1
          fi
          {
            echo "BUILD_KEYCHAIN_PASSWORD="
            echo "CERTIFICATE_PATH="
            echo "KEYCHAIN_PATH="
            echo "NOTARY_PROFILE="
            echo "USER_KEYCHAINS_PATH="
          } >> "$GITHUB_ENV" || cleanup_status=1
          exit "$cleanup_status"

      - name: Upload verified release package
        if: success()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-package
          path: |
            dist/*.dmg
            dist/SHA256SUMS
          if-no-files-found: error
          retention-days: 7

  attest-package:
    name: Attest verified release package
    needs:
      - prepare
      - package
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      attestations: write
      contents: read
      id-token: write
    steps:
      - name: Download verified release package
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: release-package
          path: release-package

      - name: Verify package identity before attestation
        env:
          EXPECTED_DMG_NAME: ${{ needs.package.outputs.dmg_name }}
          EXPECTED_DMG_SHA256: ${{ needs.package.outputs.dmg_sha256 }}
          EXPECTED_DMG_SIZE: ${{ needs.package.outputs.dmg_size }}
        run: |
          set -euo pipefail
          DMG_PATH="release-package/$EXPECTED_DMG_NAME"
          test -f "$DMG_PATH"
          test "$(sha256sum "$DMG_PATH" | awk '{print $1}')" = "$EXPECTED_DMG_SHA256"
          test "$(stat -c %s "$DMG_PATH")" = "$EXPECTED_DMG_SIZE"
          test "$(cat release-package/SHA256SUMS)" = \
            "$EXPECTED_DMG_SHA256  $EXPECTED_DMG_NAME"
          (cd release-package && sha256sum --check SHA256SUMS)

      - name: Attest package provenance
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4
        with:
          subject-path: release-package/${{ needs.package.outputs.dmg_name }}

  compatibility:
    name: Verify notarized package on macOS 26
    needs:
      - package
    runs-on: macos-26
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout released commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Download verified release package
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: release-package
          path: release-package

      - name: Validate the packaged app on macOS 26
        env:
          BD_TO_AVP_SUPPORT_DIAGNOSTICS_ENDPOINT: ${{ vars.SUPPORT_DIAGNOSTICS_ENDPOINT }}
          EXPECTED_DMG_NAME: ${{ needs.package.outputs.dmg_name }}
          EXPECTED_DMG_SHA256: ${{ needs.package.outputs.dmg_sha256 }}
        run: |
          set -euo pipefail
          test "$(sw_vers -productVersion | cut -d. -f1)" = "26"
          DMG_PATH="release-package/$EXPECTED_DMG_NAME"
          test "$(shasum -a 256 "$DMG_PATH" | awk '{print $1}')" = "$EXPECTED_DMG_SHA256"
          python -m scripts.macos_release verify-dmg \
            --dmg "$DMG_PATH" \
            --verify-signatures \
            --verify-distribution \
            --smoke-app \
            --smoke-tools \
            --smoke-worker

  build-python:
    name: Build stable Python distributions
    needs:
      - prepare
      - qualify-preparation
    if: needs.prepare.outputs.publish_pypi == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      artifact_digest: ${{ steps.python_artifact.outputs.artifact-digest }}
      artifact_id: ${{ steps.python_artifact.outputs.artifact-id }}
    steps:
      - name: Checkout released commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0

      - name: Validate and build distributions
        run: |
          set -euo pipefail
          python -m scripts.release validate
          uv build
          mkdir -p python-distributions
          mv dist python-distributions/
          (
            cd python-distributions
            find dist -type f -print | LC_ALL=C sort | while IFS= read -r file; do
              shasum -a 256 "$file"
            done > SHA256SUMS
            test -s SHA256SUMS
          )

      - name: Upload Python distributions
        id: python_artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: python-distributions
          path: python-distributions
          if-no-files-found: error
          retention-days: 7

  create-draft:
    name: Create draft GitHub Release
    needs:
      - prepare
      - package
      - attest-package
      - compatibility
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    outputs:
      release_created_at: ${{ steps.draft_release.outputs.release_created_at }}
      release_id: ${{ steps.draft_release.outputs.release_id }}
      release_notes_sha256: ${{ steps.draft_release.outputs.release_notes_sha256 }}
    steps:
      - name: Download verified release package
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: release-package
          path: release-package

      - name: Verify artifact transfer
        env:
          EXPECTED_DMG_NAME: ${{ needs.package.outputs.dmg_name }}
          EXPECTED_DMG_SHA256: ${{ needs.package.outputs.dmg_sha256 }}
          EXPECTED_DMG_SIZE: ${{ needs.package.outputs.dmg_size }}
        run: |
          set -euo pipefail
          DMG_PATH="release-package/$EXPECTED_DMG_NAME"
          if [ ! -f "$DMG_PATH" ]; then
            echo "Expected DMG is missing from the workflow artifact." >&2
            exit 1
          fi
          if [ "$(sha256sum "$DMG_PATH" | awk '{print $1}')" != "$EXPECTED_DMG_SHA256" ]; then
            echo "Workflow artifact DMG digest mismatch." >&2
            exit 1
          fi
          if [ "$(stat -c %s "$DMG_PATH")" != "$EXPECTED_DMG_SIZE" ]; then
            echo "Workflow artifact DMG size mismatch." >&2
            exit 1
          fi
          EXPECTED_SUM="$EXPECTED_DMG_SHA256  $EXPECTED_DMG_NAME"
          if [ "$(cat release-package/SHA256SUMS)" != "$EXPECTED_SUM" ]; then
            echo "SHA256SUMS does not exactly describe the validated DMG." >&2
            exit 1
          fi
          (cd release-package && sha256sum --check SHA256SUMS)

      - name: Create or resume immutable-intent draft
        id: draft_release
        env:
          EXPECTED_DMG_NAME: ${{ needs.package.outputs.dmg_name }}
          GH_TOKEN: ${{ github.token }}
          MAKE_LATEST: ${{ needs.prepare.outputs.make_latest }}
          PREVIOUS_RELEASE_TAG: ${{ needs.prepare.outputs.previous_release_tag }}
          PRERELEASE: ${{ needs.prepare.outputs.prerelease }}
          RELEASE_NAME: ${{ needs.prepare.outputs.release_name }}
          RELEASE_NOTES_INPUT: ${{ inputs.release_notes }}
          RELEASE_TAG: ${{ needs.prepare.outputs.release_tag }}
        run: |
          set -euo pipefail
          MAIN_SHA=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)
          if [ "$MAIN_SHA" != "$GITHUB_SHA" ]; then
            echo "main advanced after release validation; refusing to create a draft." >&2
            exit 1
          fi
          {
            if [ -n "$RELEASE_NOTES_INPUT" ]; then
              printf '%s\n\n' "$RELEASE_NOTES_INPUT"
            fi
            cat <<'NOTES'
          The GUI app does not install Homebrew or command-line dependencies
          on first launch. Install MakeMKV separately before converting Blu-ray
          discs. Power users who use the terminal/PyPI version should follow
          the manual dependency instructions in the README.

          NOTES
          } > release-notes-prefix.md

          resolve_release_id() {
            gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
              --paginate --slurp \
              | jq -r --arg tag "$RELEASE_TAG" '
                [.[][] | select(.tag_name == $tag)]
                | if length == 0 then
                    ""
                  elif length == 1 then
                    .[0].id
                  else
                    error("Multiple releases use tag " + $tag)
                  end
              '
          }

          RELEASE_ID=$(resolve_release_id)
          if [ -z "$RELEASE_ID" ]; then
            if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG" \
              >/dev/null 2>&1; then
              echo "Git tag already exists without a resumable draft: $RELEASE_TAG" >&2
              exit 1
            fi
            RELEASE_ARGS=(
              "$RELEASE_TAG"
              --draft
              --latest=false
              --notes-file release-notes-prefix.md
              --target "$GITHUB_SHA"
              --title "$RELEASE_NAME"
            )
            if [ -n "$PREVIOUS_RELEASE_TAG" ]; then
              RELEASE_ARGS+=(
                --generate-notes
                --notes-start-tag "$PREVIOUS_RELEASE_TAG"
              )
            fi
            if [ "$PRERELEASE" = "true" ]; then
              RELEASE_ARGS+=(--prerelease)
            fi
            gh release create "${RELEASE_ARGS[@]}"
            for attempt in {1..12}; do
              RELEASE_ID=$(resolve_release_id)
              if [ -n "$RELEASE_ID" ]; then
                break
              fi
              if [ "$attempt" -eq 12 ]; then
                echo "Draft release did not become visible through the API." >&2
                exit 1
              fi
              sleep 2
            done
          fi

          if ! [[ "$RELEASE_ID" =~ ^[0-9]+$ ]]; then
            echo "Unable to resolve the draft release ID." >&2
            exit 1
          fi
          RELEASE_JSON=$(gh api \
            "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID")
          if [ "$(jq -r .draft <<< "$RELEASE_JSON")" != "true" ] \
            || [ "$(jq -r .tag_name <<< "$RELEASE_JSON")" != "$RELEASE_TAG" ] \
            || [ "$(jq -r .target_commitish <<< "$RELEASE_JSON")" != "$GITHUB_SHA" ] \
            || [ "$(jq -r .prerelease <<< "$RELEASE_JSON")" != "$PRERELEASE" ] \
            || [ "$(jq -r .name <<< "$RELEASE_JSON")" != "$RELEASE_NAME" ]; then
            echo "Existing release cannot be safely resumed." >&2
            exit 1
          fi

          mkdir -p existing-package-assets
          for ASSET_NAME in "$EXPECTED_DMG_NAME" SHA256SUMS; do
            ASSET_PATH="release-package/$ASSET_NAME"
            RELEASE_JSON=$(gh api \
              "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID")
            ASSET_COUNT=$(jq -r --arg name "$ASSET_NAME" \
              '[.assets[] | select(.name == $name)] | length' \
              <<< "$RELEASE_JSON")
            case "$ASSET_COUNT" in
              0)
                ASSET_NAME_ENCODED=$(jq -rn --arg value "$ASSET_NAME" '$value | @uri')
                UPLOADED_ASSET=$(gh api --method POST \
                  "https://uploads.github.com/repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID/assets?name=$ASSET_NAME_ENCODED" \
                  -H "Content-Type: application/octet-stream" \
                  --input "$ASSET_PATH")
                if [ "$(jq -r .name <<< "$UPLOADED_ASSET")" != "$ASSET_NAME" ]; then
                  echo "GitHub changed the uploaded asset name for $ASSET_NAME." >&2
                  exit 1
                fi
                ;;
              1)
                rm -f "existing-package-assets/$ASSET_NAME"
                ASSET_ID=$(jq -r --arg name "$ASSET_NAME" \
                  '.assets[] | select(.name == $name) | .id' \
                  <<< "$RELEASE_JSON")
                gh api "repos/$GITHUB_REPOSITORY/releases/assets/$ASSET_ID" \
                  -H "Accept: application/octet-stream" \
                  > "existing-package-assets/$ASSET_NAME"
                if [ "$(sha256sum "$ASSET_PATH" | awk '{print $1}')" \
                  != "$(sha256sum "existing-package-assets/$ASSET_NAME" | awk '{print $1}')" ]; then
                  echo "Existing draft asset differs from $ASSET_NAME." >&2
                  exit 1
                fi
                ;;
              *)
                echo "Draft release contains duplicate assets named $ASSET_NAME." >&2
                exit 1
                ;;
            esac
          done

          for attempt in {1..12}; do
            RELEASE_JSON=$(gh api "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID")
            DMG_ASSET_COUNT=$(jq -r --arg name "$EXPECTED_DMG_NAME" \
              '[.assets[] | select(.name == $name)] | length' \
              <<< "$RELEASE_JSON")
            CHECKSUM_ASSET_COUNT=$(jq \
              '[.assets[] | select(.name == "SHA256SUMS")] | length' \
              <<< "$RELEASE_JSON")
            APPCAST_ASSET_COUNT=$(jq \
              '[.assets[] | select(.name == "appcast.xml")] | length' \
              <<< "$RELEASE_JSON")
            TOTAL_ASSET_COUNT=$(jq '.assets | length' <<< "$RELEASE_JSON")
            EXPECTED_TOTAL_ASSET_COUNT=$((2 + APPCAST_ASSET_COUNT))
            if [ "$DMG_ASSET_COUNT" = "1" ] \
              && [ "$CHECKSUM_ASSET_COUNT" = "1" ] \
              && { [ "$APPCAST_ASSET_COUNT" = "0" ] || [ "$APPCAST_ASSET_COUNT" = "1" ]; } \
              && [ "$TOTAL_ASSET_COUNT" = "$EXPECTED_TOTAL_ASSET_COUNT" ]; then
              break
            fi
            if [ "$attempt" -eq 12 ]; then
              echo "Draft must contain one DMG, checksum, and at most one appcast asset." >&2
              exit 1
            fi
            sleep 2
          done
          if [ "$(jq -r .draft <<< "$RELEASE_JSON")" != "true" ]; then
            echo "Release must remain a draft until all assets are verified." >&2
            exit 1
          fi
          if [ "$(jq -r .target_commitish <<< "$RELEASE_JSON")" != "$GITHUB_SHA" ]; then
            echo "Draft release does not target github.sha." >&2
            exit 1
          fi
          if [ "$(jq -r .prerelease <<< "$RELEASE_JSON")" != "$PRERELEASE" ]; then
            echo "Draft prerelease state does not match the committed version." >&2
            exit 1
          fi
          if [ "$MAKE_LATEST" = "true" ] && [ "$PRERELEASE" = "true" ]; then
            echo "A prerelease cannot be marked latest." >&2
            exit 1
          fi
          if ! jq -e '.body | type == "string" and test("\\S")' <<< "$RELEASE_JSON" >/dev/null; then
            echo "Draft release notes must contain a version-specific summary." >&2
            exit 1
          fi
          jq -j '.body' <<< "$RELEASE_JSON" > draft-release-notes.md
          {
            echo "release_created_at=$(jq -r .created_at <<< "$RELEASE_JSON")"
            echo "release_id=$RELEASE_ID"
            echo "release_notes_sha256=$(sha256sum draft-release-notes.md | awk '{print $1}')"
          } >> "$GITHUB_OUTPUT"

      - name: Upload immutable draft release notes
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-notes-source
          path: draft-release-notes.md
          if-no-files-found: error
          retention-days: 7

  publish-appcast:
    name: Build signed cumulative appcast snapshot
    needs:
      - prepare
      - package
      - create-draft
    runs-on: macos-15
    timeout-minutes: 30
    environment: sparkle-release
    permissions:
      contents: read
    outputs:
      appcast_sha256: ${{ steps.sign_appcast.outputs.appcast_sha256 }}
      appcast_size: ${{ steps.sign_appcast.outputs.appcast_size }}
    steps:
      - name: Checkout protected release tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Download verified release package
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: release-package
          path: release-assets

      - name: Download immutable draft release notes
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: release-notes-source
          path: release-notes-source

      - name: Verify transferred release DMG
        id: release_asset
        env:
          EXPECTED_DMG_NAME: ${{ needs.package.outputs.dmg_name }}
          EXPECTED_DMG_SHA256: ${{ needs.package.outputs.dmg_sha256 }}
          EXPECTED_DMG_SIZE: ${{ needs.package.outputs.dmg_size }}
          RELEASE_CREATED_AT: ${{ needs.create-draft.outputs.release_created_at }}
          RELEASE_TAG: ${{ needs.prepare.outputs.release_tag }}
        run: |
          set -euo pipefail
          mkdir -p appcast-site
          DMG_PATH="release-assets/$EXPECTED_DMG_NAME"
          if [ ! -f "$DMG_PATH" ]; then
            echo "Expected release DMG is missing from the workflow artifact." >&2
            exit 1
          fi
          ACTUAL_SHA256=$(shasum -a 256 "$DMG_PATH" | awk '{print $1}')
          if [ "$ACTUAL_SHA256" != "$EXPECTED_DMG_SHA256" ]; then
            echo "Transferred DMG digest does not match the validated package." >&2
            exit 1
          fi
          ACTUAL_SIZE=$(stat -f %z "$DMG_PATH")
          if [ "$ACTUAL_SIZE" != "$EXPECTED_DMG_SIZE" ]; then
            echo "Transferred DMG size does not match the validated package." >&2
            exit 1
          fi
          EXPECTED_SUM="$EXPECTED_DMG_SHA256  $EXPECTED_DMG_NAME"
          if [ "$(cat release-assets/SHA256SUMS)" != "$EXPECTED_SUM" ]; then
            echo "Transferred checksum manifest mismatch." >&2
            exit 1
          fi
          (cd release-assets && shasum -a 256 --check SHA256SUMS)
          if [ -z "$RELEASE_CREATED_AT" ]; then
            echo "Draft release creation time is missing." >&2
            exit 1
          fi
          python -c \
            'import datetime, sys; datetime.datetime.fromisoformat(sys.argv[1].replace("Z", "+00:00"))' \
            "$RELEASE_CREATED_AT"
          ASSET_URL="https://github.com/$GITHUB_REPOSITORY/releases/download/$RELEASE_TAG/$EXPECTED_DMG_NAME"
          {
            echo "dmg_path=$DMG_PATH"
            echo "asset_url=$ASSET_URL"
            echo "asset_size=$EXPECTED_DMG_SIZE"
            echo "created_at=$RELEASE_CREATED_AT"
          } >> "$GITHUB_OUTPUT"

      - name: Verify immutable draft release notes
        env:
          EXPECTED_RELEASE_NOTES_SHA256: ${{ needs.create-draft.outputs.release_notes_sha256 }}
        run: |
          set -euo pipefail
          RELEASE_NOTES_FILE=release-notes-source/draft-release-notes.md
          if [ ! -f "$RELEASE_NOTES_FILE" ]; then
            echo "Immutable draft release notes artifact is missing." >&2
            exit 1
          fi
          if [ "$(shasum -a 256 "$RELEASE_NOTES_FILE" | awk '{print $1}')" \
            != "$EXPECTED_RELEASE_NOTES_SHA256" ]; then
            echo "Draft release notes artifact digest mismatch." >&2
            exit 1
          fi

      - name: Inspect draft DMG
        id: bundle
        env:
          BD_TO_AVP_SUPPORT_DIAGNOSTICS_ENDPOINT: ${{ vars.SUPPORT_DIAGNOSTICS_ENDPOINT }}
          DMG_PATH: ${{ steps.release_asset.outputs.dmg_path }}
          EXPECTED_BUILD_VERSION: ${{ needs.prepare.outputs.build_version }}
          EXPECTED_SHORT_VERSION: ${{ needs.prepare.outputs.package_version }}
        run: |
          set -euo pipefail
          python -m scripts.sparkle_bundle \
            --dmg "$DMG_PATH" \
            --release-artifact \
            --verify-signatures \
            --verify-distribution \
            > bundle-metadata.json
          if [ "$(jq -r .short_version bundle-metadata.json)" != "$EXPECTED_SHORT_VERSION" ]; then
            echo "Draft DMG short version does not match the committed version." >&2
            exit 1
          fi
          if [ "$(jq -r .build_version bundle-metadata.json)" != "$EXPECTED_BUILD_VERSION" ]; then
            echo "Draft DMG build version does not match the committed build." >&2
            exit 1
          fi
          {
            echo "build_version=$(jq -r .build_version bundle-metadata.json)"
            echo "short_version=$(jq -r .short_version bundle-metadata.json)"
            echo "minimum_system_version=$(jq -r .minimum_system_version bundle-metadata.json)"
          } >> "$GITHUB_OUTPUT"

      - name: Load active durable appcast snapshot
        env:
          BASE_SNAPSHOT_TAG: ${{ needs.prepare.outputs.base_snapshot_tag }}
          BUILD_VERSION: ${{ steps.bundle.outputs.build_version }}
          SHORT_VERSION: ${{ steps.bundle.outputs.short_version }}
        run: |
          set -euo pipefail
          if [ "$BASE_SNAPSHOT_TAG" = "bootstrap" ]; then
            cp sparkle-feed/appcast.xml appcast-site/appcast.xml
          else
            python -m scripts.release validate-tag "$BASE_SNAPSHOT_TAG" >/dev/null
            curl --fail --location --silent --show-error \
              --retry 3 --retry-delay 2 --retry-all-errors \
              --connect-timeout 10 --max-time 60 \
              "https://github.com/$GITHUB_REPOSITORY/releases/download/$BASE_SNAPSHOT_TAG/appcast.xml" \
              --output appcast-site/appcast.xml
            python scripts/sparkle_appcast.py validate-snapshot \
              --feed appcast-site/appcast.xml \
              --release-tag "$BASE_SNAPSHOT_TAG"
          fi
          python scripts/sparkle_appcast.py validate \
            --feed appcast-site/appcast.xml
          python scripts/sparkle_appcast.py check-release \
            --feed appcast-site/appcast.xml \
            --build-version "$BUILD_VERSION" \
            --short-version "$SHORT_VERSION"

      - name: Sign DMG and build appcast
        id: sign_appcast
        env:
          ASSET_SIZE: ${{ steps.release_asset.outputs.asset_size }}
          ASSET_URL: ${{ steps.release_asset.outputs.asset_url }}
          BUILD_VERSION: ${{ steps.bundle.outputs.build_version }}
          CHANNEL: ${{ needs.prepare.outputs.channel }}
          DMG_PATH: ${{ steps.release_asset.outputs.dmg_path }}
          MINIMUM_SYSTEM_VERSION: ${{ steps.bundle.outputs.minimum_system_version }}
          RELEASE_CREATED_AT: ${{ steps.release_asset.outputs.created_at }}
          RELEASE_TAG: ${{ needs.prepare.outputs.release_tag }}
          RELEASE_NOTES_FILE: release-notes-source/draft-release-notes.md
          SHORT_VERSION: ${{ steps.bundle.outputs.short_version }}
          SPARKLE_EDDSA_PRIVATE_KEY: ${{ secrets.SPARKLE_EDDSA_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          set +x
          if [ -z "$SPARKLE_EDDSA_PRIVATE_KEY" ]; then
            echo "Missing required sparkle-release secret: SPARKLE_EDDSA_PRIVATE_KEY" >&2
            exit 1
          fi
          SIGN_UPDATE=$(python scripts/sparkle_macos.py --tool sign_update)
          SIGNATURE=$(printf '%s\n' "$SPARKLE_EDDSA_PRIVATE_KEY" | \
            "$SIGN_UPDATE" --ed-key-file - -p "$DMG_PATH")
          if [ -z "$SIGNATURE" ]; then
            echo "Sparkle did not produce an EdDSA signature." >&2
            exit 1
          fi
          printf '%s\n' "$SPARKLE_EDDSA_PRIVATE_KEY" | \
            "$SIGN_UPDATE" --verify --ed-key-file - "$DMG_PATH" "$SIGNATURE"
          python scripts/sparkle_appcast.py add \
            --feed appcast-site/appcast.xml \
            --output appcast-site/appcast.xml \
            --build-version "$BUILD_VERSION" \
            --short-version "$SHORT_VERSION" \
            --channel "$CHANNEL" \
            --download-url "$ASSET_URL" \
            --length "$ASSET_SIZE" \
            --signature "$SIGNATURE" \
            --release-notes-file "$RELEASE_NOTES_FILE" \
            --full-release-notes-url "https://github.com/$GITHUB_REPOSITORY/releases/tag/$RELEASE_TAG" \
            --minimum-system-version "$MINIMUM_SYSTEM_VERSION" \
            --published-at "$RELEASE_CREATED_AT"
          python scripts/sparkle_appcast.py validate-snapshot \
            --feed appcast-site/appcast.xml \
            --short-version "$SHORT_VERSION"
          {
            echo "appcast_sha256=$(shasum -a 256 appcast-site/appcast.xml | awk '{print $1}')"
            echo "appcast_size=$(stat -f %z appcast-site/appcast.xml)"
          } >> "$GITHUB_OUTPUT"

      - name: Upload signed appcast for verification
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: signed-appcast
          path: appcast-site/appcast.xml
          if-no-files-found: error
          retention-days: 7

  verify-draft:
    name: Upload, re-download, and verify draft assets
    needs:
      - prepare
      - package
      - create-draft
      - publish-appcast
    runs-on: macos-15
    timeout-minutes: 45
    permissions:
      attestations: read
      contents: write
    outputs:
      appcast_asset_id: ${{ steps.verify_assets.outputs.appcast_asset_id }}
      checksum_asset_id: ${{ steps.verify_assets.outputs.checksum_asset_id }}
      checksum_sha256: ${{ steps.verify_assets.outputs.checksum_sha256 }}
      checksum_size: ${{ steps.verify_assets.outputs.checksum_size }}
      dmg_asset_id: ${{ steps.verify_assets.outputs.dmg_asset_id }}
    steps:
      - name: Checkout protected verification tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Download signed appcast
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: signed-appcast
          path: signed-appcast

      - name: Upload appcast snapshot to draft
        env:
          EXPECTED_APPCAST_SHA256: ${{ needs.publish-appcast.outputs.appcast_sha256 }}
          EXPECTED_APPCAST_SIZE: ${{ needs.publish-appcast.outputs.appcast_size }}
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ needs.create-draft.outputs.release_id }}
          RELEASE_TAG: ${{ needs.prepare.outputs.release_tag }}
        run: |
          set -euo pipefail
          LOCAL_APPCAST=signed-appcast/appcast.xml
          if [ "$(shasum -a 256 "$LOCAL_APPCAST" | awk '{print $1}')" != "$EXPECTED_APPCAST_SHA256" ]; then
            echo "Signed appcast workflow artifact digest mismatch." >&2
            exit 1
          fi
          if [ "$(stat -f %z "$LOCAL_APPCAST")" != "$EXPECTED_APPCAST_SIZE" ]; then
            echo "Signed appcast workflow artifact size mismatch." >&2
            exit 1
          fi

          RELEASE_JSON=$(gh api "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID")
          if [ "$(jq -r .draft <<< "$RELEASE_JSON")" != "true" ]; then
            echo "Release was published before appcast verification." >&2
            exit 1
          fi
          APPCAST_COUNT=$(jq '[.assets[] | select(.name == "appcast.xml")] | length' <<< "$RELEASE_JSON")
          case "$APPCAST_COUNT" in
            0)
              UPLOADED_APPCAST=$(gh api --method POST \
                "https://uploads.github.com/repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID/assets?name=appcast.xml" \
                -H "Content-Type: application/xml" \
                --input "$LOCAL_APPCAST")
              if [ "$(jq -r .name <<< "$UPLOADED_APPCAST")" != "appcast.xml" ]; then
                echo "GitHub changed the uploaded appcast asset name." >&2
                exit 1
              fi
              ;;
            1)
              mkdir -p existing-appcast
              APPCAST_ASSET_ID=$(jq -r \
                '.assets[] | select(.name == "appcast.xml") | .id' \
                <<< "$RELEASE_JSON")
              gh api "repos/$GITHUB_REPOSITORY/releases/assets/$APPCAST_ASSET_ID" \
                -H "Accept: application/octet-stream" \
                > existing-appcast/appcast.xml
              if [ "$(shasum -a 256 existing-appcast/appcast.xml | awk '{print $1}')" \
                != "$EXPECTED_APPCAST_SHA256" ]; then
                echo "Existing draft appcast asset differs from the signed snapshot." >&2
                exit 1
              fi
              ;;
            *)
              echo "Draft release contains duplicate appcast assets." >&2
              exit 1
              ;;
          esac

      - name: Re-download and verify every release boundary
        id: verify_assets
        env:
          BD_TO_AVP_SUPPORT_DIAGNOSTICS_ENDPOINT: ${{ vars.SUPPORT_DIAGNOSTICS_ENDPOINT }}
          EXPECTED_APPCAST_SHA256: ${{ needs.publish-appcast.outputs.appcast_sha256 }}
          EXPECTED_APPCAST_SIZE: ${{ needs.publish-appcast.outputs.appcast_size }}
          EXPECTED_BUILD_VERSION: ${{ needs.prepare.outputs.build_version }}
          EXPECTED_DMG_NAME: ${{ needs.package.outputs.dmg_name }}
          EXPECTED_DMG_SHA256: ${{ needs.package.outputs.dmg_sha256 }}
          EXPECTED_DMG_SIZE: ${{ needs.package.outputs.dmg_size }}
          EXPECTED_RELEASE_NOTES_SHA256: ${{ needs.create-draft.outputs.release_notes_sha256 }}
          EXPECTED_SHORT_VERSION: ${{ needs.prepare.outputs.package_version }}
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ needs.create-draft.outputs.release_id }}
          RELEASE_TAG: ${{ needs.prepare.outputs.release_tag }}
        run: |
          set -euo pipefail
          mkdir -p verified-assets
          for attempt in {1..12}; do
            RELEASE_JSON=$(gh api "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID")
            DMG_ASSET_COUNT=$(jq -r --arg name "$EXPECTED_DMG_NAME" \
              '[.assets[] | select(.name == $name)] | length' <<< "$RELEASE_JSON")
            APPCAST_ASSET_COUNT=$(jq \
              '[.assets[] | select(.name == "appcast.xml")] | length' \
              <<< "$RELEASE_JSON")
            CHECKSUM_ASSET_COUNT=$(jq \
              '[.assets[] | select(.name == "SHA256SUMS")] | length' \
              <<< "$RELEASE_JSON")
            TOTAL_ASSET_COUNT=$(jq '.assets | length' <<< "$RELEASE_JSON")
            if [ "$DMG_ASSET_COUNT" = "1" ] \
              && [ "$APPCAST_ASSET_COUNT" = "1" ] \
              && [ "$CHECKSUM_ASSET_COUNT" = "1" ] \
              && [ "$TOTAL_ASSET_COUNT" = "3" ]; then
              break
            fi
            if [ "$attempt" -eq 12 ]; then
              echo "Draft release must contain only one DMG, checksum, and appcast asset." >&2
              exit 1
            fi
            sleep 2
          done
          if [ "$(jq -r .draft <<< "$RELEASE_JSON")" != "true" ]; then
            echo "Release must still be a draft during final verification." >&2
            exit 1
          fi
          if [ "$(jq -r .target_commitish <<< "$RELEASE_JSON")" != "$GITHUB_SHA" ]; then
            echo "Draft target changed after creation." >&2
            exit 1
          fi
          if ! jq -e '.body | type == "string" and test("\\S")' <<< "$RELEASE_JSON" >/dev/null; then
            echo "Draft release notes became empty before final verification." >&2
            exit 1
          fi
          jq -j '.body' <<< "$RELEASE_JSON" > verified-assets/release-notes.md
          if [ "$(shasum -a 256 verified-assets/release-notes.md | awk '{print $1}')" \
            != "$EXPECTED_RELEASE_NOTES_SHA256" ]; then
            echo "Draft release notes changed after appcast construction." >&2
            exit 1
          fi
          ASSET_URL="https://github.com/$GITHUB_REPOSITORY/releases/download/$RELEASE_TAG/$EXPECTED_DMG_NAME"
          ASSET_SIZE=$(jq -r --arg name "$EXPECTED_DMG_NAME" \
            '.assets[] | select(.name == $name) | .size' <<< "$RELEASE_JSON")
          if [ "$ASSET_SIZE" != "$EXPECTED_DMG_SIZE" ]; then
            echo "GitHub DMG asset size changed after upload." >&2
            exit 1
          fi
          DMG_ASSET_ID=$(jq -r --arg name "$EXPECTED_DMG_NAME" \
            '.assets[] | select(.name == $name) | .id' <<< "$RELEASE_JSON")
          CHECKSUM_ASSET_ID=$(jq -r \
            '.assets[] | select(.name == "SHA256SUMS") | .id' \
            <<< "$RELEASE_JSON")
          APPCAST_ASSET_ID=$(jq -r \
            '.assets[] | select(.name == "appcast.xml") | .id' \
            <<< "$RELEASE_JSON")

          DMG_PATH="verified-assets/$EXPECTED_DMG_NAME"
          gh api "repos/$GITHUB_REPOSITORY/releases/assets/$DMG_ASSET_ID" \
            -H "Accept: application/octet-stream" > "$DMG_PATH"
          gh api "repos/$GITHUB_REPOSITORY/releases/assets/$CHECKSUM_ASSET_ID" \
            -H "Accept: application/octet-stream" > verified-assets/SHA256SUMS
          gh api "repos/$GITHUB_REPOSITORY/releases/assets/$APPCAST_ASSET_ID" \
            -H "Accept: application/octet-stream" > verified-assets/appcast.xml

          if [ "$(shasum -a 256 "$DMG_PATH" | awk '{print $1}')" != "$EXPECTED_DMG_SHA256" ]; then
            echo "Re-downloaded DMG digest mismatch." >&2
            exit 1
          fi
          if [ "$(stat -f %z "$DMG_PATH")" != "$EXPECTED_DMG_SIZE" ]; then
            echo "Re-downloaded DMG size mismatch." >&2
            exit 1
          fi
          EXPECTED_SUM="$EXPECTED_DMG_SHA256  $EXPECTED_DMG_NAME"
          if [ "$(cat verified-assets/SHA256SUMS)" != "$EXPECTED_SUM" ]; then
            echo "Re-downloaded checksum manifest mismatch." >&2
            exit 1
          fi
          (cd verified-assets && shasum -a 256 --check SHA256SUMS)
          gh attestation verify "$DMG_PATH" \
            --repo "$GITHUB_REPOSITORY" \
            --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release-engine.yml" \
            --signer-digest "$GITHUB_SHA" \
            --source-digest "$GITHUB_SHA" \
            --source-ref refs/heads/main \
            --deny-self-hosted-runners
          if [ "$(shasum -a 256 verified-assets/appcast.xml | awk '{print $1}')" \
            != "$EXPECTED_APPCAST_SHA256" ]; then
            echo "Re-downloaded appcast digest mismatch." >&2
            exit 1
          fi
          if [ "$(stat -f %z verified-assets/appcast.xml)" != "$EXPECTED_APPCAST_SIZE" ]; then
            echo "Re-downloaded appcast size mismatch." >&2
            exit 1
          fi

          python -m scripts.sparkle_bundle \
            --dmg "$DMG_PATH" \
            --release-artifact \
            --verify-signatures \
            --verify-distribution \
            > verified-bundle.json
          if [ "$(jq -r .short_version verified-bundle.json)" != "$EXPECTED_SHORT_VERSION" ] \
            || [ "$(jq -r .build_version verified-bundle.json)" != "$EXPECTED_BUILD_VERSION" ]; then
            echo "Re-downloaded DMG version metadata mismatch." >&2
            exit 1
          fi
          python scripts/sparkle_appcast.py validate-snapshot \
            --feed verified-assets/appcast.xml \
            --short-version "$EXPECTED_SHORT_VERSION"
          python scripts/sparkle_appcast.py verify-release \
            --feed verified-assets/appcast.xml \
            --build-version "$EXPECTED_BUILD_VERSION" \
            --short-version "$EXPECTED_SHORT_VERSION" \
            --download-url "$ASSET_URL" \
            --length "$ASSET_SIZE" \
            --release-notes-file verified-assets/release-notes.md \
            --full-release-notes-url "https://github.com/$GITHUB_REPOSITORY/releases/tag/$RELEASE_TAG"
          {
            echo "dmg_asset_id=$DMG_ASSET_ID"
            echo "checksum_asset_id=$CHECKSUM_ASSET_ID"
            echo "checksum_sha256=$(shasum -a 256 verified-assets/SHA256SUMS | awk '{print $1}')"
            echo "checksum_size=$(stat -f %z verified-assets/SHA256SUMS)"
            echo "appcast_asset_id=$APPCAST_ASSET_ID"
          } >> "$GITHUB_OUTPUT"

  build-receipt:
    name: Build and verify immutable release receipt
    needs:
      - policy
      - prepare
      - package
      - create-draft
      - publish-appcast
      - verify-draft
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    outputs:
      receipt_asset_id: ${{ steps.receipt.outputs.receipt_asset_id }}
      receipt_file_sha256: ${{ steps.receipt.outputs.receipt_file_sha256 }}
      receipt_sha256: ${{ steps.receipt.outputs.receipt_sha256 }}
    steps:
      - name: Checkout protected receipt tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Build, upload, and re-download receipt
        id: receipt
        env:
          APPCAST_ASSET_ID: ${{ needs.verify-draft.outputs.appcast_asset_id }}
          APPCAST_SHA256: ${{ needs.publish-appcast.outputs.appcast_sha256 }}
          APPCAST_SIZE: ${{ needs.publish-appcast.outputs.appcast_size }}
          BUILD_VERSION: ${{ needs.prepare.outputs.build_version }}
          CHECKSUM_ASSET_ID: ${{ needs.verify-draft.outputs.checksum_asset_id }}
          CHECKSUM_SHA256: ${{ needs.verify-draft.outputs.checksum_sha256 }}
          CHECKSUM_SIZE: ${{ needs.verify-draft.outputs.checksum_size }}
          DMG_ASSET_ID: ${{ needs.verify-draft.outputs.dmg_asset_id }}
          DMG_NAME: ${{ needs.package.outputs.dmg_name }}
          DMG_SHA256: ${{ needs.package.outputs.dmg_sha256 }}
          DMG_SIZE: ${{ needs.package.outputs.dmg_size }}
          GH_TOKEN: ${{ github.token }}
          MAKE_LATEST: ${{ needs.prepare.outputs.make_latest }}
          PACKAGE_VERSION: ${{ needs.prepare.outputs.package_version }}
          PRERELEASE: ${{ needs.prepare.outputs.prerelease }}
          PUBLIC_VERSION: ${{ needs.prepare.outputs.public_version }}
          RELEASE_ACTOR: ${{ github.actor }}
          RELEASE_CREATED_AT: ${{ needs.create-draft.outputs.release_created_at }}
          RELEASE_ID: ${{ needs.create-draft.outputs.release_id }}
          RELEASE_NAME: ${{ needs.prepare.outputs.release_name }}
          RELEASE_ROUTE: ${{ needs.policy.outputs.release_route }}
          RELEASE_TAG: ${{ needs.prepare.outputs.release_tag }}
          SIGNED_APP_TREE_SHA256: ${{ needs.package.outputs.signed_app_tree_sha256 }}
        run: |
          set -euo pipefail
          jq -n \
            --arg release_route "$RELEASE_ROUTE" \
            --arg source_sha "$GITHUB_SHA" \
            --arg workflow_actor "$RELEASE_ACTOR" \
            --argjson workflow_run_id "$GITHUB_RUN_ID" \
            --argjson workflow_run_attempt "$GITHUB_RUN_ATTEMPT" \
            --arg package_version "$PACKAGE_VERSION" \
            --arg public_version "$PUBLIC_VERSION" \
            --arg build_version "$BUILD_VERSION" \
            --arg release_tag "$RELEASE_TAG" \
            --arg release_name "$RELEASE_NAME" \
            --argjson release_id "$RELEASE_ID" \
            --arg release_created_at "$RELEASE_CREATED_AT" \
            --argjson prerelease "$PRERELEASE" \
            --argjson make_latest "$MAKE_LATEST" \
            --arg signed_app_tree_sha256 "$SIGNED_APP_TREE_SHA256" \
            --arg dmg_name "$DMG_NAME" \
            --arg dmg_sha256 "$DMG_SHA256" \
            --argjson dmg_size "$DMG_SIZE" \
            --argjson dmg_asset_id "$DMG_ASSET_ID" \
            --arg checksum_sha256 "$CHECKSUM_SHA256" \
            --argjson checksum_size "$CHECKSUM_SIZE" \
            --argjson checksum_asset_id "$CHECKSUM_ASSET_ID" \
            --arg appcast_sha256 "$APPCAST_SHA256" \
            --argjson appcast_size "$APPCAST_SIZE" \
            --argjson appcast_asset_id "$APPCAST_ASSET_ID" \
            '{
              release_route: $release_route,
              source_sha: $source_sha,
              workflow_actor: $workflow_actor,
              workflow_run_id: $workflow_run_id,
              workflow_run_attempt: $workflow_run_attempt,
              package_version: $package_version,
              public_version: $public_version,
              build_version: $build_version,
              release_tag: $release_tag,
              release_name: $release_name,
              release_id: $release_id,
              release_created_at: $release_created_at,
              prerelease: $prerelease,
              make_latest: $make_latest,
              signed_app_tree_sha256: $signed_app_tree_sha256,
              artifacts: [
                {kind: "dmg", name: $dmg_name, sha256: $dmg_sha256, size_bytes: $dmg_size, asset_id: $dmg_asset_id},
                {kind: "checksum", name: "SHA256SUMS", sha256: $checksum_sha256, size_bytes: $checksum_size, asset_id: $checksum_asset_id},
                {kind: "appcast", name: "appcast.xml", sha256: $appcast_sha256, size_bytes: $appcast_size, asset_id: $appcast_asset_id}
              ]
            }' > release-receipt-facts.json
          python -m scripts.release_receipt build \
            --facts release-receipt-facts.json \
            --output release-receipt.json
          RECEIPT_FILE_SHA256=$(sha256sum release-receipt.json | awk '{print $1}')
          RECEIPT_SHA256=$(jq -r .receipt_sha256 release-receipt.json)

          RELEASE_JSON=$(gh api "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID")
          if [ "$(jq -r .draft <<< "$RELEASE_JSON")" != "true" ]; then
            echo "Release must remain a draft while the receipt is attached." >&2
            exit 1
          fi
          RECEIPT_COUNT=$(jq '[.assets[] | select(.name == "release-receipt.json")] | length' <<< "$RELEASE_JSON")
          case "$RECEIPT_COUNT" in
            0)
              UPLOADED_RECEIPT=$(gh api --method POST \
                "https://uploads.github.com/repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID/assets?name=release-receipt.json" \
                -H "Content-Type: application/json" \
                --input release-receipt.json)
              RECEIPT_ASSET_ID=$(jq -r .id <<< "$UPLOADED_RECEIPT")
              ;;
            1)
              RECEIPT_ASSET_ID=$(jq -r '.assets[] | select(.name == "release-receipt.json") | .id' <<< "$RELEASE_JSON")
              gh api "repos/$GITHUB_REPOSITORY/releases/assets/$RECEIPT_ASSET_ID" \
                -H "Accept: application/octet-stream" > existing-release-receipt.json
              if ! cmp --silent release-receipt.json existing-release-receipt.json; then
                echo "Existing immutable release receipt differs from the verified receipt." >&2
                exit 1
              fi
              ;;
            *)
              echo "Draft release contains duplicate release receipts." >&2
              exit 1
              ;;
          esac

          gh api "repos/$GITHUB_REPOSITORY/releases/assets/$RECEIPT_ASSET_ID" \
            -H "Accept: application/octet-stream" > downloaded-release-receipt.json
          if ! cmp --silent release-receipt.json downloaded-release-receipt.json; then
            echo "Re-downloaded release receipt differs from the verified local receipt." >&2
            exit 1
          fi
          python -m scripts.release_receipt validate --receipt downloaded-release-receipt.json
          RECEIPT_ASSET_JSON=$(gh api "repos/$GITHUB_REPOSITORY/releases/assets/$RECEIPT_ASSET_ID")
          if [ "$(jq -r .digest <<< "$RECEIPT_ASSET_JSON")" != "sha256:$RECEIPT_FILE_SHA256" ]; then
            echo "GitHub receipt asset digest differs from the verified local receipt." >&2
            exit 1
          fi
          {
            echo "receipt_asset_id=$RECEIPT_ASSET_ID"
            echo "receipt_file_sha256=$RECEIPT_FILE_SHA256"
            echo "receipt_sha256=$RECEIPT_SHA256"
          } >> "$GITHUB_OUTPUT"

  signed-artifact-ui:
    name: Prove signed artifact UI accessibility
    needs:
      - policy
      - prepare
      - package
      - create-draft
      - verify-draft
      - build-receipt
    runs-on: macos-26
    timeout-minutes: 45
    permissions:
      contents: read
    outputs:
      artifact_id: ${{ steps.signed_ui_artifact.outputs.artifact-id }}
      receipt_path: ${{ steps.ui.outputs.receipt_path }}
      receipt_file_sha256: ${{ steps.ui.outputs.receipt_file_sha256 }}
    steps:
      - name: Checkout exact candidate UI tests
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Select pinned macOS UI toolchain
        run: |
          set -euo pipefail
          test "$(uname -m)" = "arm64"
          test "$(sw_vers -productVersion | cut -d. -f1)" = "26"
          XCODE_PATH="/Applications/Xcode_${XCODE_VERSION}.app/Contents/Developer"
          if [ ! -d "$XCODE_PATH" ]; then
            echo "Pinned Xcode path is unavailable: $XCODE_PATH" >&2
            exit 1
          fi
          sudo xcode-select -s "$XCODE_PATH"
          test "$(xcodebuild -version | sed -n '1p')" = "Xcode $XCODE_VERSION"
          test "$(xcodebuild -version | sed -n '2p')" = "Build version $XCODE_BUILD_VERSION"

      - name: Install pinned XcodeGen
        run: |
          set -euo pipefail
          ARCHIVE="$RUNNER_TEMP/xcodegen.zip"
          curl --fail --location --silent --show-error \
            "https://github.com/yonaskolb/XcodeGen/releases/download/$XCODEGEN_VERSION/xcodegen.zip" \
            --output "$ARCHIVE"
          printf '%s  %s\n' "$XCODEGEN_SHA256" "$ARCHIVE" | shasum -a 256 --check
          ditto -x -k "$ARCHIVE" "$RUNNER_TEMP"
          test "$("$RUNNER_TEMP/xcodegen/bin/xcodegen" --version)" = "Version: $XCODEGEN_VERSION"
          echo "$RUNNER_TEMP/xcodegen/bin" >> "$GITHUB_PATH"

      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
          python-version: "3.12"

      - name: Install Python and generate Xcode project
        run: |
          set -euo pipefail
          uv python install 3.12
          uv sync --locked --all-groups --python 3.12
          uv run python scripts/native_app.py generate

      - name: Download exact signed release assets
        env:
          DMG_ASSET_ID: ${{ needs.verify-draft.outputs.dmg_asset_id }}
          DMG_NAME: ${{ needs.prepare.outputs.dmg_name }}
          DMG_SHA256: ${{ needs.package.outputs.dmg_sha256 }}
          DMG_SIZE: ${{ needs.package.outputs.dmg_size }}
          RECEIPT_ASSET_ID: ${{ needs.build-receipt.outputs.receipt_asset_id }}
          RECEIPT_FILE_SHA256: ${{ needs.build-receipt.outputs.receipt_file_sha256 }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p signed-artifact-assets
          gh api "repos/$GITHUB_REPOSITORY/releases/assets/$RECEIPT_ASSET_ID" \
            -H "Accept: application/octet-stream" > signed-artifact-assets/release-receipt.json
          test "$(shasum -a 256 signed-artifact-assets/release-receipt.json | awk '{print $1}')" = "$RECEIPT_FILE_SHA256"
          RECEIPT_ASSET_JSON=$(gh api "repos/$GITHUB_REPOSITORY/releases/assets/$RECEIPT_ASSET_ID")
          test "$(jq -r .digest <<< "$RECEIPT_ASSET_JSON")" = "sha256:$RECEIPT_FILE_SHA256"

          gh api "repos/$GITHUB_REPOSITORY/releases/assets/$DMG_ASSET_ID" \
            -H "Accept: application/octet-stream" > "signed-artifact-assets/$DMG_NAME"
          test "$(shasum -a 256 "signed-artifact-assets/$DMG_NAME" | awk '{print $1}')" = "$DMG_SHA256"
          test "$(stat -f %z "signed-artifact-assets/$DMG_NAME")" = "$DMG_SIZE"
          DMG_ASSET_JSON=$(gh api "repos/$GITHUB_REPOSITORY/releases/assets/$DMG_ASSET_ID")
          test "$(jq -r .digest <<< "$DMG_ASSET_JSON")" = "sha256:$DMG_SHA256"

      - name: Run installed candidate UI accessibility lane
        id: ui
        env:
          DMG_NAME: ${{ needs.prepare.outputs.dmg_name }}
          RECEIPT_ASSET_ID: ${{ needs.build-receipt.outputs.receipt_asset_id }}
          RECEIPT_FILE_SHA256: ${{ needs.build-receipt.outputs.receipt_file_sha256 }}
        run: |
          set -euo pipefail
          uv run python -m scripts.signed_artifact_ui \
            --policy "$RELEASE_QUALIFICATION_POLICY" \
            --release-receipt signed-artifact-assets/release-receipt.json \
            --dmg "signed-artifact-assets/$DMG_NAME" \
            --qualification-root "$RUNNER_TEMP/signed-artifact-ui" \
            --evidence-directory signed-artifact-ui-evidence \
            --output-receipt signed-artifact-ui-receipt.json \
            --workflow-run-id "$GITHUB_RUN_ID" \
            --workflow-run-attempt "$GITHUB_RUN_ATTEMPT" \
            --release-receipt-asset-id "$RECEIPT_ASSET_ID" \
            --release-receipt-file-sha256 "$RECEIPT_FILE_SHA256"
          RECEIPT_FILE_SHA256=$(shasum -a 256 signed-artifact-ui-receipt.json | awk '{print $1}')
          {
            echo "receipt_path=signed-artifact-ui-receipt.json"
            echo "receipt_file_sha256=$RECEIPT_FILE_SHA256"
          } >> "$GITHUB_OUTPUT"

      - name: Retain signed artifact UI receipt
        id: signed_ui_artifact
        if: success()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: signed-artifact-ui-${{ github.run_attempt }}
          path: signed-artifact-ui-receipt.json
          if-no-files-found: error
          retention-days: 7

  qualify-artifact:
    name: Qualify exact release artifact
    needs:
      - policy
      - prepare
      - package
      - create-draft
      - publish-appcast
      - verify-draft
      - build-receipt
      - signed-artifact-ui
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout exact candidate and qualification evidence
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Download and verify release receipt
        env:
          EXPECTED_RECEIPT_ASSET_ID: ${{ needs.build-receipt.outputs.receipt_asset_id }}
          EXPECTED_RECEIPT_FILE_SHA256: ${{ needs.build-receipt.outputs.receipt_file_sha256 }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/releases/assets/$EXPECTED_RECEIPT_ASSET_ID" \
            -H "Accept: application/octet-stream" > release-receipt.json
          if [ "$(sha256sum release-receipt.json | awk '{print $1}')" != "$EXPECTED_RECEIPT_FILE_SHA256" ]; then
            echo "Release receipt digest mismatch before artifact qualification." >&2
            exit 1
          fi

      - name: Download signed artifact UI receipt
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          artifact-ids: ${{ needs.signed-artifact-ui.outputs.artifact_id }}
          path: signed-artifact-ui

      - name: Classify exact artifact evidence
        id: qualification
        env:
          APPCAST_ASSET_ID: ${{ needs.verify-draft.outputs.appcast_asset_id }}
          APPCAST_SHA256: ${{ needs.publish-appcast.outputs.appcast_sha256 }}
          CHECKSUM_ASSET_ID: ${{ needs.verify-draft.outputs.checksum_asset_id }}
          CHECKSUM_SHA256: ${{ needs.verify-draft.outputs.checksum_sha256 }}
          BUILD_VERSION: ${{ needs.prepare.outputs.build_version }}
          DMG_ASSET_ID: ${{ needs.verify-draft.outputs.dmg_asset_id }}
          DMG_NAME: ${{ needs.prepare.outputs.dmg_name }}
          DMG_SHA256: ${{ needs.package.outputs.dmg_sha256 }}
          DMG_SIZE: ${{ needs.package.outputs.dmg_size }}
          FIRST_CANDIDATE_OF_CYCLE: ${{ needs.prepare.outputs.first_candidate_of_cycle }}
          PACKAGE_VERSION: ${{ needs.prepare.outputs.package_version }}
          PUBLIC_VERSION: ${{ needs.prepare.outputs.public_version }}
          RECEIPT_ASSET_ID: ${{ needs.build-receipt.outputs.receipt_asset_id }}
          RECEIPT_FILE_SHA256: ${{ needs.build-receipt.outputs.receipt_file_sha256 }}
          RECEIPT_SELF_SHA256: ${{ needs.build-receipt.outputs.receipt_sha256 }}
          RELEASE_ID: ${{ needs.create-draft.outputs.release_id }}
          RELEASE_ROUTE: ${{ needs.policy.outputs.release_route }}
          RELEASE_STAGE: ${{ needs.prepare.outputs.channel }}
          RELEASE_TAG: ${{ needs.prepare.outputs.release_tag }}
          SIGNED_APP_TREE_SHA256: ${{ needs.package.outputs.signed_app_tree_sha256 }}
          SIGNED_ARTIFACT_RECEIPT: signed-artifact-ui/${{ needs.signed-artifact-ui.outputs.receipt_path }}
          SIGNED_ARTIFACT_RECEIPT_SHA256: ${{ needs.signed-artifact-ui.outputs.receipt_file_sha256 }}
        run: |
          set -euo pipefail
          FIRST_CANDIDATE_ARGS=()
          if [ "$FIRST_CANDIDATE_OF_CYCLE" = "true" ]; then
            FIRST_CANDIDATE_ARGS+=(--first-candidate-of-cycle)
          fi
          set +e
          python -m scripts.qualify_release_scope \
            --policy "$RELEASE_QUALIFICATION_POLICY" \
            --qualification "$RELEASE_QUALIFICATION_RECORD" \
            --evidence "$RELEASE_QUALIFICATION_EVIDENCE" \
            --candidate-sha "$GITHUB_SHA" \
            --release-stage "$RELEASE_STAGE" \
            --workflow-phase artifact \
            "${FIRST_CANDIDATE_ARGS[@]}" \
            --release-receipt release-receipt.json \
            --signed-artifact-receipt "$SIGNED_ARTIFACT_RECEIPT" \
            --signed-artifact-receipt-sha256 "$SIGNED_ARTIFACT_RECEIPT_SHA256" \
            --release-route "$RELEASE_ROUTE" \
            --workflow-run-id "$GITHUB_RUN_ID" \
            --workflow-run-attempt "$GITHUB_RUN_ATTEMPT" \
            --release-id "$RELEASE_ID" \
            --package-version "$PACKAGE_VERSION" \
            --public-version "$PUBLIC_VERSION" \
            --build-version "$BUILD_VERSION" \
            --release-tag "$RELEASE_TAG" \
            --dmg-name "$DMG_NAME" \
            --release-receipt-asset-id "$RECEIPT_ASSET_ID" \
            --release-receipt-sha256 "$RECEIPT_FILE_SHA256" \
            --release-receipt-self-sha256 "$RECEIPT_SELF_SHA256" \
            --signed-app-tree-sha256 "$SIGNED_APP_TREE_SHA256" \
            --dmg-asset-id "$DMG_ASSET_ID" \
            --dmg-size "$DMG_SIZE" \
            --dmg-sha256 "$DMG_SHA256" \
            --checksum-asset-id "$CHECKSUM_ASSET_ID" \
            --checksum-sha256 "$CHECKSUM_SHA256" \
            --appcast-asset-id "$APPCAST_ASSET_ID" \
            --appcast-sha256 "$APPCAST_SHA256" \
            --output release-qualification-final.json \
            --require-evidence
          EXIT_CODE=$?
          set -e
          echo "exit_code=$EXIT_CODE" >> "$GITHUB_OUTPUT"

      - name: Retain final qualification report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-qualification-final-${{ github.run_attempt }}
          path: release-qualification-final.json
          if-no-files-found: warn
          retention-days: 30

      - name: Enforce exact artifact qualification
        if: always()
        env:
          QUALIFICATION_EXIT_CODE: ${{ steps.qualification.outputs.exit_code }}
        run: |
          set -euo pipefail
          if [ "$QUALIFICATION_EXIT_CODE" != "0" ]; then
            echo "Exact artifact qualification failed with exit code $QUALIFICATION_EXIT_CODE." >&2
            exit "$QUALIFICATION_EXIT_CODE"
          fi

  publish-release:
    name: Publish verified GitHub Release
    needs:
      - build-python
      - create-draft
      - prepare
      - package
      - verify-draft
      - build-receipt
      - signed-artifact-ui
      - qualify-artifact
    if: >-
      !cancelled() &&
      needs.create-draft.result == 'success' &&
      needs.prepare.result == 'success' &&
      needs.package.result == 'success' &&
      needs.verify-draft.result == 'success' &&
      needs.build-receipt.result == 'success' &&
      needs.signed-artifact-ui.result == 'success' &&
      needs.qualify-artifact.result == 'success' &&
      (
        needs.prepare.outputs.publish_pypi != 'true' ||
        needs.build-python.result == 'success'
      )
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Publish only the verified main release
        env:
          EXPECTED_DMG_NAME: ${{ needs.package.outputs.dmg_name }}
          GH_TOKEN: ${{ github.token }}
          MAKE_LATEST: ${{ needs.prepare.outputs.make_latest }}
          PRERELEASE: ${{ needs.prepare.outputs.prerelease }}
          EXPECTED_RELEASE_NOTES_SHA256: ${{ needs.create-draft.outputs.release_notes_sha256 }}
          RELEASE_ID: ${{ needs.create-draft.outputs.release_id }}
          RELEASE_NAME: ${{ needs.prepare.outputs.release_name }}
          RELEASE_TAG: ${{ needs.prepare.outputs.release_tag }}
          EXPECTED_RECEIPT_ASSET_ID: ${{ needs.build-receipt.outputs.receipt_asset_id }}
          EXPECTED_RECEIPT_FILE_SHA256: ${{ needs.build-receipt.outputs.receipt_file_sha256 }}
        run: |
          set -euo pipefail
          case "$PRERELEASE:$MAKE_LATEST" in
            true:false|false:true)
              ;;
            *)
              echo "Release channel metadata is inconsistent." >&2
              exit 1
              ;;
          esac
          verify_release_notes_body() {
            local release_json="$1"
            if ! jq -e '.body | type == "string" and test("\\S")' <<< "$release_json" >/dev/null; then
              echo "Release notes became empty before publication." >&2
              exit 1
            fi
            jq -j '.body' <<< "$release_json" > release-notes.md
            if [ "$(sha256sum release-notes.md | awk '{print $1}')" \
              != "$EXPECTED_RELEASE_NOTES_SHA256" ]; then
              echo "Release notes changed after appcast verification." >&2
              exit 1
            fi
          }
          RELEASE_JSON=$(gh api "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID")
          verify_release_notes_body "$RELEASE_JSON"
          RECEIPT_COUNT=$(jq '[.assets[] | select(.name == "release-receipt.json")] | length' <<< "$RELEASE_JSON")
          TOTAL_ASSET_COUNT=$(jq '.assets | length' <<< "$RELEASE_JSON")
          if [ "$RECEIPT_COUNT" != "1" ] || [ "$TOTAL_ASSET_COUNT" != "4" ]; then
            echo "Verified release must contain exactly the DMG, checksum, appcast, and receipt assets." >&2
            exit 1
          fi
          RECEIPT_ASSET_ID=$(jq -r '.assets[] | select(.name == "release-receipt.json") | .id' <<< "$RELEASE_JSON")
          if [ "$RECEIPT_ASSET_ID" != "$EXPECTED_RECEIPT_ASSET_ID" ]; then
            echo "Release receipt asset identity changed before publication." >&2
            exit 1
          fi
          gh api "repos/$GITHUB_REPOSITORY/releases/assets/$RECEIPT_ASSET_ID" \
            -H "Accept: application/octet-stream" > release-receipt.json
          if [ "$(sha256sum release-receipt.json | awk '{print $1}')" != "$EXPECTED_RECEIPT_FILE_SHA256" ]; then
            echo "Release receipt digest changed before publication." >&2
            exit 1
          fi
          if [ "$(jq -r .target_commitish <<< "$RELEASE_JSON")" != "$GITHUB_SHA" ]; then
            echo "Release target no longer matches github.sha." >&2
            exit 1
          fi
          if [ "$(jq -r .draft <<< "$RELEASE_JSON")" = "true" ]; then
            jq -n \
              --rawfile body release-notes.md \
              --argjson prerelease "$PRERELEASE" \
              --arg make_latest "$MAKE_LATEST" \
              '{
                body: $body,
                draft: false,
                prerelease: $prerelease,
                make_latest: $make_latest
              }' > publish-release.json
            MAIN_SHA=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)
            if [ "$MAIN_SHA" != "$GITHUB_SHA" ]; then
              echo "main advanced immediately before publication; leaving the verified release as a draft." >&2
              exit 1
            fi
            gh api --method PATCH \
              "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" \
              --input publish-release.json >/dev/null
            RELEASE_JSON=$(gh api "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID")
            verify_release_notes_body "$RELEASE_JSON"
          fi

          for attempt in {1..12}; do
            RELEASE_JSON=$(gh api "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID")
            if [ "$(jq -r .draft <<< "$RELEASE_JSON")" = "false" ] \
              && [ "$(jq -r .immutable <<< "$RELEASE_JSON")" = "true" ]; then
              break
            fi
            if [ "$attempt" -eq 12 ]; then
              echo "Published release did not become immutable." >&2
              exit 1
            fi
            sleep 5
          done
          verify_release_notes_body "$RELEASE_JSON"
          if [ "$(jq -r .prerelease <<< "$RELEASE_JSON")" != "$PRERELEASE" ]; then
            echo "Published release channel does not match the committed version." >&2
            exit 1
          fi
          if [ "$(jq -r .name <<< "$RELEASE_JSON")" != "$RELEASE_NAME" ]; then
            echo "Published release title does not match the committed version." >&2
            exit 1
          fi
          if [ "$(jq -r .published_at <<< "$RELEASE_JSON")" = "null" ]; then
            echo "Published release is missing published_at." >&2
            exit 1
          fi
          TAG_SHA=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG" --jq .object.sha)
          if [ "$TAG_SHA" != "$GITHUB_SHA" ]; then
            echo "Published tag does not resolve to github.sha." >&2
            exit 1
          fi
          ASSET_URL=$(jq -r --arg name "$EXPECTED_DMG_NAME" \
            '.assets[] | select(.name == $name) | .browser_download_url' <<< "$RELEASE_JSON")
          EXPECTED_ASSET_URL="https://github.com/$GITHUB_REPOSITORY/releases/download/$RELEASE_TAG/$EXPECTED_DMG_NAME"
          if [ "$ASSET_URL" != "$EXPECTED_ASSET_URL" ]; then
            echo "Published DMG asset URL does not match the immutable tag URL." >&2
            exit 1
          fi
          for attempt in {1..12}; do
            if curl --fail --location --silent --show-error --range 0-0 \
              "$ASSET_URL" --output /dev/null; then
              exit 0
            fi
            if [ "$attempt" -eq 12 ]; then
              echo "Published DMG did not become publicly downloadable." >&2
              exit 1
            fi
            sleep 5
          done

  deploy-appcast:
    name: Deploy verified appcast snapshot
    needs:
      - prepare
      - publish-appcast
      - publish-release
    if: >-
      !cancelled() &&
      needs.prepare.result == 'success' &&
      needs.publish-appcast.result == 'success' &&
      needs.publish-release.result == 'success'
    uses: ./.github/workflows/sparkle-pages.yml
    with:
      operation: deploy
      release_tag: ${{ needs.prepare.outputs.release_tag }}
      expected_appcast_sha256: ${{ needs.publish-appcast.outputs.appcast_sha256 }}
      expected_base_release_tag: ${{ needs.prepare.outputs.base_snapshot_tag }}
    permissions:
      contents: read
      id-token: write
      pages: write
