---
name: Release Evidence

"on":
  workflow_run:
    workflows:
      - Stable
      - Prerelease
    types:
      - completed

concurrency:
  group: release-evidence-${{ github.event.workflow_run.id }}
  cancel-in-progress: false

jobs:
  validate-and-prepare:
    name: Validate publication and prepare checked evidence
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: read
      contents: read
    outputs:
      base_main_sha: ${{ steps.base.outputs.sha }}
      evidence_ref: ${{ steps.sanitize.outputs.evidence_ref }}
      existing_branch_sha: ${{ steps.reuse.outputs.existing_branch_sha }}
      has_changes: ${{ steps.stage.outputs.has_changes }}
      manifest_sha256: ${{ steps.final-outputs.outputs.manifest_sha256 }}
      receipt_file_sha256: ${{ steps.final-outputs.outputs.receipt_file_sha256 }}
      release_run_id: ${{ steps.final-outputs.outputs.release_run_id }}
      release_tag: ${{ steps.sanitize.outputs.release_tag }}
      signed_ui_receipt_sha256: ${{ steps.final-outputs.outputs.signed_ui_receipt_sha256 }}
      signed_ui_artifact_sha256: ${{ steps.final-outputs.outputs.signed_ui_artifact_sha256 }}
      source_sha: ${{ steps.final-outputs.outputs.source_sha }}
    steps:
      - name: Checkout current protected main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: main

      - name: Record protected-main evidence base
        id: base
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Resolve release evidence source
        id: source
        env:
          COMPLETED_DISPLAY_TITLE: ${{ github.event.workflow_run.display_title }}
          COMPLETED_RUN_ID: ${{ github.event.workflow_run.id }}
          COMPLETED_SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ "$COMPLETED_DISPLAY_TITLE" = "Stable PyPI recovery" ]; then
            python -m scripts.stable_pypi_recovery outputs --github-output "$GITHUB_OUTPUT"
            {
              echo "recovery=true"
              echo "recovery_run_id=$COMPLETED_RUN_ID"
            } >> "$GITHUB_OUTPUT"
            gh api "repos/$GITHUB_REPOSITORY/actions/runs/$COMPLETED_RUN_ID" > recovery-workflow-run.json
            python -m scripts.stable_pypi_recovery verify-pypi \
              --state published \
              --retries 6 \
              --delay 10
            RELEASE_SOURCE_SHA=$(sed -n 's/^release_source_sha=//p' "$GITHUB_OUTPUT" | tail -1)
            git merge-base --is-ancestor "$RELEASE_SOURCE_SHA" HEAD
          else
            {
              echo "release_run_id=$COMPLETED_RUN_ID"
              echo "release_source_sha=$COMPLETED_SOURCE_SHA"
              echo "recovery=false"
              echo "recovery_run_id="
            } >> "$GITHUB_OUTPUT"
          fi

      - name: Resolve the immutable release and receipt
        id: publication
        env:
          EXPECTED_RUN_ID: ${{ steps.source.outputs.release_run_id }}
          EXPECTED_SOURCE_SHA: ${{ steps.source.outputs.release_source_sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$EXPECTED_RUN_ID" > workflow-run.json
          if [ "$(jq -r .head_sha workflow-run.json)" != "$EXPECTED_SOURCE_SHA" ]; then
            echo "Workflow-run API source SHA differs from the completion event." >&2
            exit 1
          fi
          gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
            --paginate --slurp > releases-pages.json
          jq -c \
            --arg source_sha "$EXPECTED_SOURCE_SHA" \
            '[.[][] | select(
              .target_commitish == $source_sha
              and .draft == false
              and .immutable == true
              and any(.assets[]?; .name == "release-receipt.json")
            )]' releases-pages.json > release-matches.json
          rm -f release.json release-receipt.json
          MATCH_COUNT=0
          while IFS= read -r candidate; do
            RECEIPT_ASSET_ID=$(jq -r '.assets[] | select(.name == "release-receipt.json") | .id' <<< "$candidate")
            gh api "repos/$GITHUB_REPOSITORY/releases/assets/$RECEIPT_ASSET_ID" \
              -H "Accept: application/octet-stream" > candidate-release-receipt.json
            if [ "$(jq -r .workflow.run_id candidate-release-receipt.json)" = "$EXPECTED_RUN_ID" ] \
              && [ "$(jq -r .workflow.run_attempt candidate-release-receipt.json)" \
                = "$(jq -r .run_attempt workflow-run.json)" ]; then
              MATCH_COUNT=$((MATCH_COUNT + 1))
              printf '%s\n' "$candidate" > release.json
              cp candidate-release-receipt.json release-receipt.json
            fi
          done < <(jq -c '.[]' release-matches.json)
          if [ "$MATCH_COUNT" != "1" ]; then
            echo "Expected exactly one immutable published release receipt for the completed run and attempt." >&2
            exit 1
          fi
          curl --fail --location --silent --show-error \
            --retry 3 --retry-delay 2 --retry-all-errors \
            --connect-timeout 10 --max-time 60 \
            "https://cbusillo.github.io/BD_to_AVP/appcast.xml" \
            --output live-appcast.xml
          echo "live_appcast_verified_at=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_OUTPUT"

      - name: Sanitize release evidence tag and ref
        id: sanitize
        run: |
          set -euo pipefail
          python -m scripts.release_evidence_v2 sanitize \
            --release-receipt release-receipt.json \
            --github-output "$GITHUB_OUTPUT"

      - name: Preserve an existing idempotent evidence branch
        id: reuse
        env:
          EVIDENCE_REF: ${{ steps.sanitize.outputs.evidence_ref }}
          RELEASE_TAG: ${{ steps.sanitize.outputs.release_tag }}
        run: |
          set -euo pipefail
          RECEIPT_FILE_SHA256=$(sha256sum release-receipt.json | awk '{print $1}')
          BRANCH_NAME="$EVIDENCE_REF"
          MANIFEST_PATH="docs/release-evidence/$RELEASE_TAG/qualification-manifest.json"
          QUALIFICATION_RECORD_PATH="docs/release-evidence/$RELEASE_TAG/qualification-record.json"
          SIGNED_UI_ARCHIVE_PATH="docs/release-evidence/$RELEASE_TAG/signed-artifact-ui.zip"
          SIGNED_UI_PATH="docs/release-evidence/$RELEASE_TAG/signed-artifact-ui-receipt.json"
          if [ -f "$MANIFEST_PATH" ] || [ -f "$QUALIFICATION_RECORD_PATH" ] \
            || [ -f "$SIGNED_UI_ARCHIVE_PATH" ] || [ -f "$SIGNED_UI_PATH" ]; then
            if [ ! -f "$MANIFEST_PATH" ] || [ ! -f "$QUALIFICATION_RECORD_PATH" ] \
              || [ ! -f "$SIGNED_UI_ARCHIVE_PATH" ] || [ ! -f "$SIGNED_UI_PATH" ]; then
              echo "Protected main contains partial qualification checkpoint state." >&2
              exit 1
            fi
            MAIN_BASE_SHA=$(jq -er .canonical_evidence.base_sha "$MANIFEST_PATH")
            python -m scripts.release_qualification_manifest validate \
              --manifest "$MANIFEST_PATH" \
              --repo-root . \
              --evidence-base-revision "$MAIN_BASE_SHA" \
              > existing-manifest-outputs.json
            git merge-base --is-ancestor "$(jq -er .runner_sha existing-manifest-outputs.json)" HEAD
            {
              echo "artifact_id=$(jq -r .signed_ui_artifact_id existing-manifest-outputs.json)"
              echo "artifact_sha256=$(jq -r .signed_ui_artifact_sha256 existing-manifest-outputs.json)"
              echo "checkpoint_source=main"
              echo "existing_branch_sha="
              echo "has_manifest=true"
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if ! git ls-remote --exit-code --heads origin "refs/heads/$BRANCH_NAME" >/dev/null 2>&1; then
            {
              echo "checkpoint_source=none"
              echo "existing_branch_sha="
              echo "has_manifest=false"
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git fetch --no-tags origin "refs/heads/$BRANCH_NAME:refs/remotes/origin/release-evidence-existing"
          echo "existing_branch_sha=$(git rev-parse refs/remotes/origin/release-evidence-existing)" >> "$GITHUB_OUTPUT"
          if git diff --name-only main...refs/remotes/origin/release-evidence-existing \
            | grep -Ev '^docs/' | grep -q .; then
            echo "Existing evidence branch contains changes outside docs/." >&2
            exit 1
          fi
          RECEIPT_PATH="docs/release-evidence/$RELEASE_TAG/release-receipt.json"
          if git cat-file -e "refs/remotes/origin/release-evidence-existing:$RECEIPT_PATH" 2>/dev/null; then
            git show "refs/remotes/origin/release-evidence-existing:$RECEIPT_PATH" > existing-release-receipt.json
            if [ "$(sha256sum existing-release-receipt.json | awk '{print $1}')" != "$RECEIPT_FILE_SHA256" ]; then
              echo "Existing evidence branch contains a conflicting receipt for the immutable release." >&2
              exit 1
            fi
          fi
          HAS_MANIFEST=false
          if git cat-file -e "refs/remotes/origin/release-evidence-existing:$MANIFEST_PATH" 2>/dev/null \
            || git cat-file -e "refs/remotes/origin/release-evidence-existing:$QUALIFICATION_RECORD_PATH" 2>/dev/null \
            || git cat-file -e "refs/remotes/origin/release-evidence-existing:$SIGNED_UI_ARCHIVE_PATH" 2>/dev/null \
            || git cat-file -e "refs/remotes/origin/release-evidence-existing:$SIGNED_UI_PATH" 2>/dev/null; then
            if ! git cat-file -e "refs/remotes/origin/release-evidence-existing:$MANIFEST_PATH" 2>/dev/null \
              || ! git cat-file -e "refs/remotes/origin/release-evidence-existing:$QUALIFICATION_RECORD_PATH" 2>/dev/null \
              || ! git cat-file -e "refs/remotes/origin/release-evidence-existing:$SIGNED_UI_ARCHIVE_PATH" 2>/dev/null \
              || ! git cat-file -e "refs/remotes/origin/release-evidence-existing:$SIGNED_UI_PATH" 2>/dev/null; then
              echo "Existing evidence branch contains partial qualification checkpoint state." >&2
              exit 1
            fi
            EXISTING_WORKTREE="$RUNNER_TEMP/release-evidence-existing"
            git worktree add --detach "$EXISTING_WORKTREE" refs/remotes/origin/release-evidence-existing
            EXISTING_BASE_SHA=$(jq -er .canonical_evidence.base_sha "$EXISTING_WORKTREE/$MANIFEST_PATH")
            python -m scripts.release_qualification_manifest validate \
              --manifest "$EXISTING_WORKTREE/$MANIFEST_PATH" \
              --repo-root "$EXISTING_WORKTREE" \
              --evidence-base-revision "$EXISTING_BASE_SHA" \
              > existing-manifest-outputs.json
            git -C "$EXISTING_WORKTREE" merge-base --is-ancestor \
              "$(jq -er .runner_sha existing-manifest-outputs.json)" HEAD
            git worktree remove --force "$EXISTING_WORKTREE"
            HAS_MANIFEST=true
            {
              echo "artifact_id=$(jq -r .signed_ui_artifact_id existing-manifest-outputs.json)"
              echo "artifact_sha256=$(jq -r .signed_ui_artifact_sha256 existing-manifest-outputs.json)"
            } >> "$GITHUB_OUTPUT"
          fi
          echo "checkpoint_source=branch" >> "$GITHUB_OUTPUT"
          echo "has_manifest=$HAS_MANIFEST" >> "$GITHUB_OUTPUT"
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git checkout --detach refs/remotes/origin/release-evidence-existing
          if ! git merge --no-edit main; then
            ROLLING_QUALIFICATION_PATH=$(jq -er .releaseOperations.qualificationRecordPath .github/github.json)
            CONFLICTS=$(git diff --name-only --diff-filter=U)
            CONFLICT_COUNT=$(printf '%s\n' "$CONFLICTS" | sed '/^$/d' | wc -l | tr -d ' ')
            if [ "$CONFLICT_COUNT" = "1" ] && [ "$CONFLICTS" = "$ROLLING_QUALIFICATION_PATH" ]; then
              git checkout --theirs -- "$ROLLING_QUALIFICATION_PATH"
              git add "$ROLLING_QUALIFICATION_PATH"
              git commit --no-edit
            else
              printf 'Existing evidence branch has unsupported merge conflicts:\n%s\n' "$CONFLICTS" >&2
              git merge --abort
              exit 1
            fi
          fi

      - name: Capture signed artifact UI receipt before expiry
        id: signed-ui
        if: steps.reuse.outputs.checkpoint_source != 'main'
        env:
          GH_TOKEN: ${{ github.token }}
          REUSED_ARTIFACT_ID: ${{ steps.reuse.outputs.artifact_id }}
          REUSED_ARTIFACT_SHA256: ${{ steps.reuse.outputs.artifact_sha256 }}
          REUSED_MANIFEST: ${{ steps.reuse.outputs.has_manifest }}
        run: |
          set -euo pipefail
          CANDIDATE_TAG=$(jq -er .release.tag release-receipt.json)
          CANDIDATE_SHA=$(jq -er .source_sha release-receipt.json)
          CANDIDATE_RUN_ID=$(jq -er .workflow.run_id release-receipt.json)
          CANDIDATE_RUN_ATTEMPT=$(jq -er .workflow.run_attempt release-receipt.json)
          RECEIPT_FILE_SHA256=$(sha256sum release-receipt.json | awk '{print $1}')
          RECEIPT_ASSET_ID=$(jq -er \
            --arg digest "sha256:$RECEIPT_FILE_SHA256" \
            '.assets[] | select(.name == "release-receipt.json" and .digest == $digest) | .id' \
            release.json)
          ARTIFACT_NAME="signed-artifact-ui-$CANDIDATE_RUN_ATTEMPT"
          mkdir -p signed-artifact-ui
          SIGNED_UI_ARCHIVE=signed-artifact-ui.zip
          SIGNED_UI_RECEIPT=signed-artifact-ui/signed-artifact-ui-receipt.json
          CHECKED_SIGNED_UI_ARCHIVE="docs/release-evidence/$CANDIDATE_TAG/signed-artifact-ui.zip"
          CHECKED_SIGNED_UI="docs/release-evidence/$CANDIDATE_TAG/signed-artifact-ui-receipt.json"
          if [ "$REUSED_MANIFEST" = "true" ]; then
            test -f "$CHECKED_SIGNED_UI"
            SIGNED_UI_ARTIFACT_ID=$REUSED_ARTIFACT_ID
            SIGNED_UI_ARTIFACT_SHA256=$REUSED_ARTIFACT_SHA256
            SIGNED_UI_ARCHIVE=$CHECKED_SIGNED_UI_ARCHIVE
            cp "$CHECKED_SIGNED_UI" "$SIGNED_UI_RECEIPT"
          else
            gh api "repos/$GITHUB_REPOSITORY/actions/runs/$CANDIDATE_RUN_ID/artifacts?per_page=100" \
              --paginate --slurp > signed-ui-artifacts-pages.json
            jq -c \
              --arg name "$ARTIFACT_NAME" \
              --arg head_sha "$CANDIDATE_SHA" \
              --argjson run_id "$CANDIDATE_RUN_ID" \
              '[.[] | .artifacts[] | select(
                .expired == false
                and .name == $name
                and .workflow_run.id == $run_id
                and .workflow_run.head_branch == "main"
                and .workflow_run.head_sha == $head_sha
                and (.digest | startswith("sha256:"))
              )]' signed-ui-artifacts-pages.json > signed-ui-artifact-matches.json
            MATCH_COUNT=$(jq 'length' signed-ui-artifact-matches.json)
            if [ "$MATCH_COUNT" = "0" ]; then
              echo "The signed UI Actions artifact expired before Release Evidence captured it; immutable release qualification cannot be reconstructed." >&2
              exit 1
            fi
            if [ "$MATCH_COUNT" != "1" ]; then
              echo "Expected one exact signed UI Actions artifact; found $MATCH_COUNT." >&2
              exit 1
            fi
            jq '.[0]' signed-ui-artifact-matches.json > signed-artifact-ui-metadata.json
            SIGNED_UI_ARTIFACT_ID=$(jq -er .id signed-artifact-ui-metadata.json)
            SIGNED_UI_ARTIFACT_SHA256=$(jq -er '.digest | sub("^sha256:"; "")' signed-artifact-ui-metadata.json)
            gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$SIGNED_UI_ARTIFACT_ID/zip" \
              > "$SIGNED_UI_ARCHIVE"
            test "$(sha256sum "$SIGNED_UI_ARCHIVE" | awk '{print $1}')" = "$SIGNED_UI_ARTIFACT_SHA256"
            unzip -q "$SIGNED_UI_ARCHIVE" -d signed-artifact-ui
            test "$(find signed-artifact-ui -type f | wc -l | tr -d ' ')" = "1"
          fi
          test -f "$SIGNED_UI_RECEIPT"
          SIGNED_UI_RECEIPT_FILE_SHA256=$(sha256sum "$SIGNED_UI_RECEIPT" | awk '{print $1}')
          python -m scripts.signed_artifact_receipt validate \
            --receipt "$SIGNED_UI_RECEIPT" \
            --receipt-file-sha256 "$SIGNED_UI_RECEIPT_FILE_SHA256" \
            --release-receipt release-receipt.json \
            --release-receipt-asset-id "$RECEIPT_ASSET_ID" \
            --release-receipt-file-sha256 "$RECEIPT_FILE_SHA256" \
            --workflow-run-id "$CANDIDATE_RUN_ID" \
            --workflow-run-attempt "$CANDIDATE_RUN_ATTEMPT"
          {
            echo "artifact_id=$SIGNED_UI_ARTIFACT_ID"
            echo "artifact_sha256=$SIGNED_UI_ARTIFACT_SHA256"
            echo "archive_path=$SIGNED_UI_ARCHIVE"
            echo "receipt_file_sha256=$SIGNED_UI_RECEIPT_FILE_SHA256"
            echo "receipt_path=$SIGNED_UI_RECEIPT"
          } >> "$GITHUB_OUTPUT"
          python -m scripts.release qualification-base \
            --release-tag "$CANDIDATE_TAG" \
            --releases-json releases-pages.json \
            --head-ref "$CANDIDATE_SHA" \
            --checked-receipts-root docs/release-evidence \
            --github-output "$GITHUB_OUTPUT"
          PRIOR_TAG=$(sed -n 's/^prior_tag=//p' "$GITHUB_OUTPUT" | tail -1)
          if [ -z "$PRIOR_TAG" ]; then
            echo "Unable to derive prior published release tag for milestone qualification." >&2
            exit 1
          fi

      - name: Reconcile checked evidence
        id: reconcile
        if: steps.reuse.outputs.checkpoint_source != 'main'
        env:
          RECOVERY: ${{ steps.source.outputs.recovery }}
        run: |
          set -euo pipefail
          RECOVERY_ARGS=()
          if [ "$RECOVERY" = "true" ]; then
            RECOVERY_ARGS+=(--recovery-workflow-run recovery-workflow-run.json)
          fi
          python -m scripts.release_evidence \
            --workflow-run workflow-run.json \
            --release release.json \
            --receipt release-receipt.json \
            --live-appcast live-appcast.xml \
            --prior-tag "${{ steps.signed-ui.outputs.prior_tag }}" \
            --signed-ui-artifact-id "${{ steps.signed-ui.outputs.artifact_id }}" \
            --signed-ui-artifact-digest "${{ steps.signed-ui.outputs.artifact_sha256 }}" \
            --signed-ui-artifact-archive "${{ steps.signed-ui.outputs.archive_path }}" \
            --signed-ui-receipt "${{ steps.signed-ui.outputs.receipt_path }}" \
            --signed-ui-receipt-file-sha256 "${{ steps.signed-ui.outputs.receipt_file_sha256 }}" \
            --evidence-ref "${{ steps.sanitize.outputs.evidence_ref }}" \
            --evidence-base-sha "${{ steps.base.outputs.sha }}" \
            --runner-sha "${{ steps.base.outputs.sha }}" \
            --sparkle-route "${{ steps.signed-ui.outputs.sparkle_route }}" \
            --repo-root "$GITHUB_WORKSPACE" \
            "${RECOVERY_ARGS[@]}" \
            --github-output "$GITHUB_OUTPUT"

      - name: Generate or validate shadow capture-v2
        id: capture-v2
        env:
          CAPTURE_TIMESTAMP: ${{ steps.publication.outputs.live_appcast_verified_at }}
          CAPTURE_WORKFLOW_ACTOR: ${{ github.actor }}
          CAPTURE_WORKFLOW_RUN_ATTEMPT: ${{ github.run_attempt }}
          CAPTURE_WORKFLOW_RUN_ID: ${{ github.run_id }}
          EVIDENCE_REF: ${{ steps.sanitize.outputs.evidence_ref }}
          RELEASE_TAG: ${{ steps.sanitize.outputs.release_tag }}
        run: |
          set -euo pipefail
          BUNDLE="docs/release-evidence/$RELEASE_TAG"
          python -m scripts.release_evidence_v2 capture \
            --repo-root "$GITHUB_WORKSPACE" \
            --release-receipt "$BUNDLE/release-receipt.json" \
            --release release.json \
            --qualification-record "$BUNDLE/qualification-record.json" \
            --qualification-manifest "$BUNDLE/qualification-manifest.json" \
            --signed-ui-archive "$BUNDLE/signed-artifact-ui.zip" \
            --signed-ui-receipt "$BUNDLE/signed-artifact-ui-receipt.json" \
            --live-appcast live-appcast.xml \
            --captured-at "$CAPTURE_TIMESTAMP" \
            --live-appcast-verified-at "$CAPTURE_TIMESTAMP" \
            --capture-workflow-actor "$CAPTURE_WORKFLOW_ACTOR" \
            --capture-workflow-path .github/workflows/release-evidence.yml \
            --capture-workflow-run-id "$CAPTURE_WORKFLOW_RUN_ID" \
            --capture-workflow-run-attempt "$CAPTURE_WORKFLOW_RUN_ATTEMPT" \
            --evidence-ref "$EVIDENCE_REF" \
            --github-output "$GITHUB_OUTPUT"

      - name: Generate and check shadow index-v2
        run: |
          set -euo pipefail
          python -m scripts.release_evidence_v2 index --write --repo-root "$GITHUB_WORKSPACE"
          python -m scripts.release_evidence_v2 index --check --worktree --repo-root "$GITHUB_WORKSPACE"

      - name: Publish complete evidence outputs
        id: final-outputs
        env:
          RELEASE_TAG: ${{ steps.sanitize.outputs.release_tag }}
        run: |
          set -euo pipefail
          BUNDLE="docs/release-evidence/$RELEASE_TAG"
          {
            echo "manifest_sha256=$(jq -er .manifest_sha256 "$BUNDLE/qualification-manifest.json")"
            echo "receipt_file_sha256=$(sha256sum "$BUNDLE/release-receipt.json" | awk '{print $1}')"
            echo "release_run_id=$(jq -er .workflow.run_id "$BUNDLE/release-receipt.json")"
            echo "signed_ui_receipt_sha256=$(jq -er .receipt_sha256 "$BUNDLE/signed-artifact-ui-receipt.json")"
            echo "signed_ui_artifact_sha256=$(sha256sum "$BUNDLE/signed-artifact-ui.zip" | awk '{print $1}')"
            echo "source_sha=$(jq -er .source_sha "$BUNDLE/release-receipt.json")"
          } >> "$GITHUB_OUTPUT"

      - name: Stage only generated evidence files
        id: stage
        run: |
          set -euo pipefail
          mkdir -p prepared-evidence
          {
            git diff --name-only main...HEAD -- docs
            git diff --name-only -- docs
            git ls-files --others --exclude-standard -- docs
          } | LC_ALL=C sort -u > evidence-files.txt
          if [ ! -s evidence-files.txt ]; then
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "has_changes=true" >> "$GITHUB_OUTPUT"
          while IFS= read -r path; do
            rsync -R "$path" prepared-evidence/
          done < evidence-files.txt

      - name: Upload prepared evidence
        if: steps.stage.outputs.has_changes == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-evidence-${{ github.event.workflow_run.id }}
          path: prepared-evidence
          if-no-files-found: error
          retention-days: 7

  create-pr:
    name: Open or update release evidence pull request
    needs: validate-and-prepare
    if: needs.validate-and-prepare.outputs.has_changes == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout current protected main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          ref: main

      - name: Reject protected-main movement during evidence transfer
        env:
          EXPECTED_MAIN_SHA: ${{ needs.validate-and-prepare.outputs.base_main_sha }}
        run: |
          set -euo pipefail
          if [ "$(git rev-parse HEAD)" != "$EXPECTED_MAIN_SHA" ]; then
            echo "Protected main moved after evidence preparation; rerun against the new base." >&2
            exit 1
          fi

      - name: Reject conflicting evidence on the idempotent branch
        env:
          EVIDENCE_REF: ${{ needs.validate-and-prepare.outputs.evidence_ref }}
          EXPECTED_EXISTING_BRANCH_SHA: ${{ needs.validate-and-prepare.outputs.existing_branch_sha }}
          EXPECTED_RECEIPT_FILE_SHA256: ${{ needs.validate-and-prepare.outputs.receipt_file_sha256 }}
          EXPECTED_SIGNED_UI_RECEIPT_SHA256: ${{ needs.validate-and-prepare.outputs.signed_ui_receipt_sha256 }}
          EXPECTED_SIGNED_UI_ARTIFACT_SHA256: ${{ needs.validate-and-prepare.outputs.signed_ui_artifact_sha256 }}
          RELEASE_TAG: ${{ needs.validate-and-prepare.outputs.release_tag }}
        run: |
          set -euo pipefail
          BRANCH_NAME="$EVIDENCE_REF"
          REMOTE_BRANCH_SHA=$(git ls-remote --heads origin "refs/heads/$BRANCH_NAME" | awk '{print $1}')
          if [ "$REMOTE_BRANCH_SHA" != "$EXPECTED_EXISTING_BRANCH_SHA" ]; then
            echo "Evidence branch moved after evidence preparation; rerun against its current head." >&2
            exit 1
          fi
          if [ -n "$REMOTE_BRANCH_SHA" ]; then
            git fetch --no-tags origin "refs/heads/$BRANCH_NAME:refs/remotes/origin/release-evidence-existing"
            RECEIPT_PATH="docs/release-evidence/$RELEASE_TAG/release-receipt.json"
            if git cat-file -e "refs/remotes/origin/release-evidence-existing:$RECEIPT_PATH" 2>/dev/null; then
              git show "refs/remotes/origin/release-evidence-existing:$RECEIPT_PATH" > existing-release-receipt.json
              if [ "$(sha256sum existing-release-receipt.json | awk '{print $1}')" \
                != "$EXPECTED_RECEIPT_FILE_SHA256" ]; then
                echo "Existing evidence branch contains a conflicting receipt for the immutable release." >&2
                exit 1
              fi
            fi
            SIGNED_UI_PATH="docs/release-evidence/$RELEASE_TAG/signed-artifact-ui-receipt.json"
            if git cat-file -e "refs/remotes/origin/release-evidence-existing:$SIGNED_UI_PATH" 2>/dev/null; then
              SIGNED_UI_SELF_DIGEST=$(git show "refs/remotes/origin/release-evidence-existing:$SIGNED_UI_PATH" \
                | jq -r .receipt_sha256)
              if [ "$SIGNED_UI_SELF_DIGEST" != "$EXPECTED_SIGNED_UI_RECEIPT_SHA256" ]; then
                echo "Existing evidence branch contains a conflicting signed UI receipt." >&2
                exit 1
              fi
            fi
            SIGNED_UI_ARCHIVE_PATH="docs/release-evidence/$RELEASE_TAG/signed-artifact-ui.zip"
            if git cat-file -e "refs/remotes/origin/release-evidence-existing:$SIGNED_UI_ARCHIVE_PATH" 2>/dev/null; then
              git show "refs/remotes/origin/release-evidence-existing:$SIGNED_UI_ARCHIVE_PATH" \
                > existing-signed-artifact-ui.zip
              if [ "$(sha256sum existing-signed-artifact-ui.zip | awk '{print $1}')" \
                != "$EXPECTED_SIGNED_UI_ARTIFACT_SHA256" ]; then
                echo "Existing evidence branch contains a conflicting signed UI artifact archive." >&2
                exit 1
              fi
            fi
          fi

      - name: Download prepared evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: release-evidence-${{ github.event.workflow_run.id }}
          path: .

      - name: Create or update evidence pull request
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8
        with:
          add-paths: docs
          branch: ${{ needs.validate-and-prepare.outputs.evidence_ref }}
          commit-message: Record immutable evidence for ${{ needs.validate-and-prepare.outputs.release_tag }}
          delete-branch: true
          title: Record immutable evidence for ${{ needs.validate-and-prepare.outputs.release_tag }}
          body: |
            Records the deterministic public-safe receipt and publication evidence for `${{ needs.validate-and-prepare.outputs.release_tag }}`.

            - Release run: `${{ needs.validate-and-prepare.outputs.release_run_id }}`
            - Source SHA: `${{ needs.validate-and-prepare.outputs.source_sha }}`
            - Receipt file SHA-256: `${{ needs.validate-and-prepare.outputs.receipt_file_sha256 }}`
            - Qualification manifest SHA-256: `${{ needs.validate-and-prepare.outputs.manifest_sha256 }}`

            The release workflow, immutable asset identities, signed artifact UI receipt, live Pages appcast, qualification manifest, qualification record, release ledger, and cut packet were revalidated before this branch was prepared. Signing and deployment secrets are not available to this workflow.

            Publication is immutable, but this PR remains intentionally unmergeable until its post-publication milestone qualification check has accepted every blocking live-artifact and automated Tier 3 receipt. Optional physical-hardware and native-window presentation outcomes remain visible without blocking reconciliation. Add validated receipts to this idempotent branch; do not rebuild, retag, or replace the published release.

            After adding or changing terminal evidence under `docs/release-evidence/<tag>/`, regenerate the advisory index with `uv run python -m scripts.release_evidence_v2 index --write --repo-root .` before pushing.
