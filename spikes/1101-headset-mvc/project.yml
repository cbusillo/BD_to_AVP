name: MVCSpike
options:
  bundleIdPrefix: com.shinycomputers.bd-to-avp
  deploymentTarget:
    visionOS: "26.0"
targets:
  MVCSpike:
    type: application
    platform: visionOS
    sources:
      - path: MVCSpike
      - path: Resources/clip.264
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.shinycomputers.bd-to-avp.mvc-spike
        PRODUCT_NAME: MVCSpike
        DEVELOPMENT_TEAM: MM5YXC7T6E
        CODE_SIGN_STYLE: Automatic
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: minimal
        SWIFT_OBJC_BRIDGING_HEADER: MVCSpike/MVCSpike-Bridging-Header.h
        HEADER_SEARCH_PATHS: $(SRCROOT)/edge264-src $(SRCROOT)/MVCSpike
        LIBRARY_SEARCH_PATHS: $(SRCROOT)/edge264-src
        OTHER_LDFLAGS: -ledge264mvc
        GCC_OPTIMIZATION_LEVEL: "3"
        SWIFT_OPTIMIZATION_LEVEL: -O
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UIFileSharingEnabled: YES
        INFOPLIST_KEY_LSSupportsOpeningDocumentsInPlace: YES
        INFOPLIST_KEY_CFBundleDisplayName: MVC Spike
        MARKETING_VERSION: "0.1"
        CURRENT_PROJECT_VERSION: "1"
